  note: >-
    Complete faithful transcription of Poul Heegaard's 1898 doctoral dissertation
    "Forstudier til en topologisk Teori for de algebraiske Fladers Sammenhæng" (pp. 1–97 text,
    p. 98 Trykfejl errata list, pp. 99–100 Teser 1–9), transcribed from the original
