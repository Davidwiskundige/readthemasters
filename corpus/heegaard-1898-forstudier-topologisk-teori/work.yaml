significance: >-
  Poul Heegaard's 1898 doctoral dissertation is one of the foundational texts of modern
  combinatorial topology and 3-manifold theory. Departing from the algebraic and analytic methods
  of Riemann, Betti[1], and Picard, Heegaard extends Julius Petersen's puncture-and-deformation
  technique to decompose a closed 3-manifold into two handlebodies meeting along a common boundary
  surface—the dividing surface (*delingsflade*) now known as a *Heegaard surface*[note 1]. The system
  of attaching curves on this surface forms a *Heegaard diagram*, which remains a standard method
  for defining and classifying 3-manifolds. Most famously, Heegaard discovered the phenomenon of
  topological torsion and constructed the celebrated counterexample to Henri Poincaré's 1895 claim
  that Betti numbers satisfy $p_r = p_{n-r}$ for any closed manifold[2][note 2]. Heegaard's finding
  demonstrated that Betti numbers alone are insufficient to classify 3-manifolds, directly prompting
  Poincaré's 1899 *Complément à l'Analysis Situs*[3] and setting the stage for Heegaard and Max Dehn's
  rigorous 1907 topological classification of 2-manifolds.
