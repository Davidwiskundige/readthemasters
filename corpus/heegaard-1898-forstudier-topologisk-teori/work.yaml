significance_notes:
- label: Heegaard splittings and diagrams
  text: >-
    A closed 3-manifold is partitioned along a closed 2-manifold (the dividing surface) into two
    handlebodies of equal genus; the system of attaching curves on this surface constitutes a Heegaard
    diagram specifying the manifold up to homeomorphism.
- label: Counterexample to Poincaré duality
  text: >-
    In §12 and Thesis 1, Heegaard showed that for non-orientable 3-manifolds with 2-torsion, the
    Betti numbers defined by submanifolds satisfy $p_1 \neq p_2$, proving that Betti numbers alone
    do not determine the connectivity of manifolds in dimension 3 and above.
