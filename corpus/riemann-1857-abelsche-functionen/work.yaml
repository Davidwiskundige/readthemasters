    note: >-
      Riemann cites this note by name in §.~14 ("nach Jacobi, dieses Journal Bd. 9 Nr. 32 §. 8")
      for the use of Abel's addition theorem to integrate a system of differential equations. It
      is also where the inversion problem for hyperelliptic integrals was posed; Riemann's second
      division solves that problem in general, for any p, by theta series of p variables.
  - to: abel-1841-fonctions-transcendantes
    kind: builds-on
    note: >-
      Abel's Paris memoir, the full statement of the addition theorem that Riemann's title calls
      the Abelian functions and that he applies in §§.~14–16 to a system of everywhere finite
      integrals of equally branched algebraic functions.

significance: >-
  This is the paper in which the theory of algebraic functions on what are now called Riemann
  surfaces was created, and in which the Jacobi inversion problem was solved in general. It is the
  last of four pieces Riemann published together in Crelle volume 54; the three that precede it[1]
  supply the surface and the
  Dirichlet principle he had first set out in his 1851 dissertation, and this fourth applies them
  to Abelian functions. Riemann works with a surface of connectivity $2p+1$, and the number $p$
  running through the whole paper is the invariant Clebsch would later name the genus.[2] The
  first division determines the functions on such a surface from their branching and their
  discontinuities rather than from any formula, sorts their integrals into the three kinds, and
  derives $p = (n-1)(m-1) - r$ for a curve $F(s,z) = 0$ of degrees $n$ and $m$ with $r$ double
  points. It also finds that a function with $m$ poles carries $m-p+1$ arbitrary constants — the
  inequality that Riemann's student Gustav Roch sharpened in 1865 into the Riemann–Roch
  theorem.[3] The same division introduces the notion of a class of algebraic equations, those
  carried into one another by rational substitutions, and shows that a class depends on $3p-3$
  continuously varying quantities which Riemann calls its Moduln — the count that is still the
  dimension of the moduli space of curves of genus $p$.[3] The second division builds the $p$-fold
  theta series and expresses Jacobi's inversion functions of $p$ variables by it, showing that a
  special class of theta series, carrying just $3p-3$ free constants, already suffices; that the
  theta function vanishes at exactly $p$ points of the cut surface; and that algebraic functions
  can be written as quotients of products of theta functions. Riemann is careful to credit
  Weierstrass, whose parallel work on hyperelliptic integrals he discusses in the introduction and
  cites again on p. 152.

