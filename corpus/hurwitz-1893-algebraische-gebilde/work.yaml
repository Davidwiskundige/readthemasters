significance: 'Hurwitz''s fundamental memoir establishing the Riemann–Hurwitz formula
  relating the genus of two Riemann surfaces under a branched covering, and proving
  Hurwitz''s automorphism theorem: an algebraic curve (Riemann surface) of genus $p
  > 1$ admits at most $84(p - 1)$ conformal automorphisms (birational transformations
  into itself).'
