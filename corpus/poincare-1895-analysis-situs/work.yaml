significance: >-
  In this memoir Poincaré made the shape of spaces of any number of dimensions a subject with its
  own objects and invariants. He defines a manifold (variété) twice, by equations and inequalities
  and by overlapping parametrized pieces, and says when two are homeomorphic (§§ 1–3). A
  homology, written $v_{1} + v_{2} \backsim 0$, says that closed manifolds together bound a
  manifold of one dimension more (§ 5), and the numbers of independent closed manifolds are the
  Betti numbers, named after Betti's paper of 1871[1] (§ 6). Counting the intersections of
  manifolds of complementary dimension (§ 9), he proves that Betti numbers equally distant from
  the two ends are equal, the first form of what is now called Poincaré duality. §§ 10–11 build
  closed three-dimensional manifolds by gluing the faces of a polyhedron in pairs and from
  discontinuous groups; § 12 introduces the fundamental group, and § 14 uses it to tell apart
  manifolds that have the same Betti numbers without being homeomorphic. The memoir ends by
  extending Euler's relation between vertices, edges and faces to polyhedra of any dimension
  (§§ 16–18). Heegaard's dissertation of 1898 found a gap in the duality argument[2], which
  Poincaré repaired in five complements to the memoir.
