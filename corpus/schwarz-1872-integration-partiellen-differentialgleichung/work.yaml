significance: Schwarz's comprehensive 1872 memoir in Crelle's Journal contains his
  celebrated rigorous solution of the Dirichlet problem for the circle via Poisson's
  integral (the Schwarz integral formula), along with detailed proofs of the boundary
  behavior, and expands on his alternating method (alternierendes Verfahren) for overlapping
  domains.
