# Term renderings for jacobi-1829-fundamenta-nova (Latin -> English), applied consistently across
# the whole translation. Format: `terms: {Latin as printed: English}`, the shape pipeline/translate.py
# reads with --glossary.
#
# Principles:
#   * Period-appropriate terminology over the modern equivalent: functio integra = "integral
#     function" only where the print says it of a polynomial; "amplitudo" stays "amplitude",
#     "modulus" stays "modulus", "complementum" is "complement" (k' is the complementary modulus).
#   * Jacobi's own coinages are met in his own word: "Transformatio prima, secunda" = "first,
#     second transformation"; "Aequationes modulares" = "modular equations"; "functiones Theta" =
#     "Theta functions" (not "theta functions").
#   * Ordinal suffixes inside formulas ($p^{\text{ti}}$ and the like) are translated inside the
#     \text{...} insert (HOUSESTYLE R21): Latin "ti/tae/tum/to" -> English "th".
#   * Latin abbreviations stay abbreviated in English where English has the same abbreviation:
#     "Cl.\ " = "Cl." (Clarissimus -> "the distinguished"), "v.\ g." -> "e.g.", "i.\ e." -> "i.e.",
#     "pag." = "p.", "§." = "§.".

