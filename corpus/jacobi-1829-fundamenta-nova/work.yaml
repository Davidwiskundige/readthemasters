significance: >-
  This is the book in which Jacobi, then a professor at Königsberg, set out the foundations of his
  theory of elliptic functions. In the Preface, dated February 1829, he says that he took up the
  theory almost two years earlier, was led to questions that seemed to give it a new aspect, and
  communicated the first results to the geometers, at first without proof and then with it; the
  book now publishes the foundations on which those investigations rest.[1] It treats the elliptic
  functions themselves, written $\sin\operatorname{am}u$, $\cos\operatorname{am}u$ and
  $\Delta\operatorname{am}u$ for the amplitude $\phi=\operatorname{am}u$ of the integral
  $u=\displaystyle\int\frac{d\phi}{\sqrt{1-k^{2}\sin^{2}\phi}}$, and works out their addition, multiplication
  and transformation, the modular equations that connect the moduli of related transformations,
  and their expansion into infinite products and into series of sines and cosines of multiples of
  the argument. Its most characteristic device is the pair of transcendents $\Theta$ and $H$,
  which play the part of denominator and numerator, so that each elliptic function appears as a
  quotient of two everywhere convergent series. The expansions are then applied to number theory,
  among them the representation of every number as a sum of four squares.[note 1] Jacobi's work
  and Abel's, begun independently at about the same time, were compared by Legendre to the efforts
  of two young athletes; Abel died in April 1829, two months after this Preface was written.[2]
  Jacobi's own note of 1832 on Abelian transcendents, also in this corpus, points back to this
  book as the place where the doubly periodic elliptic functions were established.

significance_notes:
  - label: sums of four squares
    text: >-
      The book's index announces, as an application of the theory, that every number is the sum of
      four squares. Jacobi obtains it by comparing two expansions of the fourth power of a theta
      series; the result itself is older, since Lagrange proved it in 1770, and what is new is
      the proof from elliptic functions together with the formula for the number of
      representations.

