significance: >-
  This doctoral dissertation marks the birth of the theory of Riemann surfaces and modern topology.
  Breaking decisively with the tradition that approached complex functions primarily through
  explicit algebraic and analytical formulas, Riemann reoriented the subject around global
  geometric properties, boundary conditions, and potential theory.[1] By introducing multi-sheeted
  covering surfaces, he allowed multi-valued relations to be investigated as single-valued functions
  on a geometric domain, making topology an indispensable instrument of analysis.[2] The
  dissertation also established the foundations of conformal mapping, including what is now the
  Riemann Mapping Theorem, and introduced the Dirichlet principle to solve boundary value problems,
  initiating a conceptual transformation that reshaped complex analysis, algebraic geometry, and
  mathematical physics.[1]

