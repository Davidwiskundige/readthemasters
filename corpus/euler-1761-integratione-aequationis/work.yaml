significance: >-
  Prompted by Fagnano's results on the lemniscate — which the Berlin Academy handed to Euler in
  December 1751, the day Jacobi would later call the birthday of the theory of elliptic
  functions[2] — this paper is where Euler turns Fagnano's isolated duplication and bisection
  formulas into a general algebraic addition theorem for the lemniscatic integral. He proves
  (§9, Theorema) that the complete integral of the differential equation
  $\dfrac{dx}{\sqrt{1-x^{4}}} = \dfrac{dy}{\sqrt{1-y^{4}}}$ is not transcendental but an algebraic
  relation between $x$ and $y$, and then extends the method to
  $\dfrac{m\,dx}{\sqrt{1-x^{4}}} = \dfrac{n\,dy}{\sqrt{1-y^{4}}}$ for rational $m$ and $n$, and to
  still more general quartic radicands. This algebraic addition relation is the seed of the
  addition theorems for elliptic integrals; through Legendre, Abel, and Jacobi it grew into the
  theory of elliptic functions, and in Riemann's hands into the theory of Riemann surfaces — now
  foundational to complex analysis and algebraic geometry.[1]

significance_sources:
  - citation: >-
      D. van der Lugt, "The History of the Riemann–Roch and Hirzebruch–Riemann–Roch Theorem",
      MSc thesis, Radboud University Nijmegen (2025) — §2 onward, on Fagnano, Euler's addition
      theorem, and the origins of elliptic-function theory.
    url: "https://www.math.ru.nl/~landsman/david-vdlugt-2025.pdf"
  - citation: >-
      A. Weil, "Number Theory: An Approach through History from Hammurapi to Legendre",
      Birkhäuser (1984) — recounts Jacobi's remark that the day (23 Dec. 1751) the Berlin Academy
      handed Fagnano's works to Euler may be regarded as the birthday of the theory of elliptic
      functions.

