significance: 'Poincaré''s culminating 1910 memoir provides a purely transcendental
  demonstration of the celebrated theorem of Enriques, Castelnuovo, and Severi[1]:
  that the irregularity $q = p_g - p_a$ of an algebraic surface equals the number
  of independent integrals of total differentials of the first kind discovered by
  Picard[2]. Where the Italian geometers relied on delicate dynamic limits of continuous
  systems of curves, Poincaré cuts the surface by a pencil of planes and introduces
  the abelian sums now called *Poincaré normal functions*[note 1]. Proving via Riemann
  theta functions that these normal functions characterize actual algebraic curves,
  he shows that non-linear continuous families exist if and only if the abelian differentials
  extend to total differentials, establishing the formula $q = p_g - p_a$ with analytic
  rigor. The memoir also classifies curves into primitive curves, founding Picard''s
  invariant $\rho$, and directly inspired Solomon Lefschetz''s proof of the Lefschetz
  $(1,1)$-theorem[3][note 2].'
