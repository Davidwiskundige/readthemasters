significance_notes:
- label: Poincaré normal functions
  text: An abelian integral on a moving plane section, summed across its intersections
    with an algebraic curve on the surface, defines an analytic function of the slicing
    parameter whose monodromy and zeros determine whether the curve belongs to a continuous
    system.
- label: The Lefschetz (1,1)-theorem
  text: Lefschetz used Poincaré's normal functions and vanishing cycles to prove that
    every integral cohomology class in $H^2(S, \mathbb{Z}) \cap H^{1,1}(S)$ is the
    fundamental class of an algebraic divisor.
