    note: >-
      Abel's own published announcement of the addition theorem that Jacobi here names the
      "theorema Abelianum". Jacobi restates it, observes that in the stated form it leaves the
      resulting quantities indeterminate, and recasts it as a pair of simultaneous equations.
  - to: euler-1761-integratione-aequationis
    kind: builds-on
    note: >-
      The "theorema Eulerianum" from which Jacobi's first section starts: Euler's algebraic
      addition theorem for elliptic integrals, of which Abel's theorem is the generalization.

significance: >-
  This ten-page note is where the inversion problem for hyperelliptic integrals — later called the
  Jacobi inversion problem — was first posed. Jacobi's proposal is to invert not one integral but a
  system: for $X$ of the fifth or sixth order he takes the two integrals $\Phi(x)$ and $\Phi_1(x)$,
  sets $\Phi(x)+\Phi(y)=u$ and $\Phi_1(x)+\Phi_1(y)=v$, and asks for the two functions
  $\lambda(u,v)$, $\lambda_1(u,v)$ of two arguments that this system defines. Abel's theorem then
  becomes an addition theorem for those functions. This is the problem
  whose solution by Göpel and Rosenhain in the 1840s, and in general by Riemann and Weierstrass,
  created the theory of abelian functions.[1][2] Two of the subject's standard terms are coined in
  these pages: Jacobi proposes to attach to the theorem the name theorema Abelianum — the Abelian
  theorem — as a most beautiful monument to an admirable genius carried off by an untimely death,
  and to call the
  transcendents themselves transcendentes Abelianae, noting that Legendre had also fittingly named
  them hyperelliptic.[2] In the footnote on p. 397 Jacobi presses the Paris Academy publicly to
  print Abel's 1826 memoir, still unpublished six years on and three years after Abel's death; it
  appeared in 1841.[1]

