significance: >-
  Fifteen printed lines — the only thing Emmy Noether published on the idea that made topology
  algebraic. Elementary divisor theory was the standard road to the structure of finitely
  generated abelian groups; she reverses it, winning the decomposition theorem directly and purely
  group-theoretically, then deriving elementary divisor theory back out of that. Hence the clause
  that outlived the rest: in applications — Betti and torsion numbers in topology — going back to
  elementary divisors is not required. Topologists had held the groups themselves superfluous,
  rank and torsion numbers describing them completely.[1] Hopf and Alexandroff credited the
  algebraisation of topology to her regardless.[2] She never wrote it up; this page is what there
  is, and it was left out of her Gesammelte Abhandlungen.[1]

significance_sources:
  - citation: >-
      Friedrich Hirzebruch, "Emmy Noether and Topology", Bar-Ilan University, 2 December 1996
      (MPIM preprint 1997-34). It cites this abstract as [N1] — the one publication that can be
      cited for Noether's algebraisation of topology, and one not reprinted in her Gesammelte
      Abhandlungen — and carries the Lefschetz and Alexandroff–Hopf passages. It is also careful
      that Vietoris and Mayer reached homology groups independently of her.
    url: "https://hirzebruch.mpim-bonn.mpg.de/id/eprint/98/6/preprint_1997_34.pdf"
  - citation: >-
