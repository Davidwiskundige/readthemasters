significance_notes:
  - label: In modern terms
    text: >-
      The angle subtended by a boundary element is the kernel of the double-layer potential, so the
      moment of $f$ about a boundary point is the double-layer integral operator applied to $f$. The
      successive means $v_s, v_s', v_s'', \ldots$ are then the iterates of that operator, and the
      alternating sum of them is what is now called the Neumann series; convexity is what makes
      the iteration contract, at the rate $\varkappa<1$.
