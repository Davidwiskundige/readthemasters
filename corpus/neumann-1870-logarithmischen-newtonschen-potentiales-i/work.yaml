significance: >-
  This is the announcement, without proofs, of Neumann's method of the arithmetic mean for the
  Dirichlet problem: a way of producing a function with prescribed boundary values that satisfies
  Laplace's equation without the Dirichlet principle, whose inference Weierstrass had shown to be
  unsound[1]. For a region bounded by one convex curve $S$ and continuous boundary values $f$, he
  forms at each boundary point the mean $v_s$ of $f$ weighted by the angle each boundary element
  subtends there, then averages the result again, giving $v_s', v_s'', \ldots$. These means
  converge to a constant, the oscillation of $v_s^{(n)}$ shrinking at least like
  $(M-m)\varkappa^{n+1}$ with $\varkappa<1$ a constant of the curve, and an alternating sum of the
  means gives the sought function inside $S$ and, in the coordinates $\xi, \eta$ obtained by the
  inversion $(x+iy)(\xi+i\eta)=1$, outside it[note 1]. The same function is also written as the
  logarithmic potential of a distribution of mass on $S$ or of a double layer. The note closes by
  reserving a method of combination, for several or non-convex boundary curves, and a treatment of
  space for later communications; the second communication, read on 31 October 1870, follows in the
  same volume. Schwarz's alternating method, published the same year, attacks the same problem by
  a different route[2].
