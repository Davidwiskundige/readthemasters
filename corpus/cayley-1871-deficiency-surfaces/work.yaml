  note: Cayley builds directly on Clebsch's 1868 definition of the deficiency (Flächengeschlecht)
    of an algebraic surface, extending Clebsch's formula for surfaces with double
    and cuspidal curves to higher-order singular curves and conical points.
- to: noether-1869-algebraische-functionen-mehrerer-variablen
  kind: builds-on
  note: Cayley applies Noether's postulation formula for an $i$-tuple curve and conical
    points, citing Noether's results on the deficiency-value of singularities.
significance: 'In this four-page note in the Mathematische Annalen (1871), Arthur
  Cayley reveals a striking phenomenon in the nascent geometry of algebraic surfaces:
  the deficiency (arithmetic genus $p_a$) can be negative. Clebsch (1868) and Noether
  (1869) had defined the genus of a surface of degree $n$ through the postulation
  of adjoint surfaces of degree $n-4$. Cayley evaluates this formula for ruled surfaces
  (scrolls) and cones over curves of genus $p > 0$, showing that the deficiency equals
  $-p$, the negative of the genus of the plane section.[1] Cayley conjectures that
  surfaces of negative deficiency are precisely the rational transforms of cones over
  curves of positive deficiency, and demonstrates this with a quintic surface having
  two cubiconical points and a nodal conic.'
