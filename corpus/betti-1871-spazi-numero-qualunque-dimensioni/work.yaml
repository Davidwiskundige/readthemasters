significance: >-
  Riemann gave a surface one number, the order of connection that counts the crosscuts needed to
  cut it simply connected[1]. Betti asks what a space of $n$ dimensions has in its place, and
  answers that it has $n-1$: it has simple connection of the $m^{\text{th}}$ species when every
  closed space of $m$ dimensions in it bounds a piece of $m+1$ dimensions, and otherwise $p_{m}$
  of them bound nothing alone while every other one bounds together with those. §3 proves $p_{m}$
  independent of the choice, which is what makes it a number; §5 shows that a cut of $k$ dimensions
  kills the connection of species $n-k$. These are the numbers Poincaré named after him a
  quarter-century later[2]. He wanted them for §§6 and 7, where the integral of a harmonic
  function's normal derivative over a closed space, and the line integral of a system satisfying
  $\frac{dX_{r}}{dz_{t}} - \frac{dX_{t}}{dz_{r}} = 0$, each pick up one period per transverse
  section crossed. They measure how far a potential in $n$ variables fails to be single-valued —
  the service Riemann's $p$ performs for an abelian integral, carried into every dimension.[note 1]

# Asides: an excursus the reader can open from the significance note instead of reading through it.
significance_notes:
  - label: "In modern notation"
    text: >-
      Betti's $p_{m}$ is the $m$-th Betti number, the rank of $H_{m}(R)$, and his "order"
      $p_{m}+1$ keeps Riemann's convention, in which the sphere is simply connected and counts 1.
      Because his systems of closed spaces are combined by union only, nothing in §3 tells a cycle
      apart from a multiple of it, so torsion is invisible to his count — the gap Poincaré filled
      with the torsion coefficients of the complements to "Analysis situs". His §5 pairing of a
      cut of $k$ dimensions with the connection of species $n-k$ is an early trace of what became
      Poincaré duality, and §§6–7, which integrate a closed system over the cycles the sections
      cross and get one period apiece, are de Rham's pairing in embryo. His four ordinary-space
      examples read off at once: the region between two concentric spheres has the homotopy type
      of $S^{2}$, whence $p_{2} = 1$ and $p_{1} = 0$; the solid ring that of $S^{1}$, whence
      $p_{1} = 1$ and $p_{2} = 0$.

significance_sources:
  - citation: >-
      Riemann's surface case, in this corpus: "Theorie der Abel'schen Functionen", printed p. 118,
      where a closed surface $T$ is cut by $2p$ crosscuts into a simply connected $T'$ — the
      single number Betti's $n-1$ numbers generalize.
    url: "/works/riemann-1857-abelsche-functionen/#p-118"
  - citation: >-
      H. Poincaré, "Analysis situs", Journal de l'École Polytechnique, 2e série, cahier 1 (1895),
      where the connectivity numbers of a manifold are called "les nombres de Betti" after this
      paper.

