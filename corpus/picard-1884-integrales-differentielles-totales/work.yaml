relations:
  - to: clebsch-1868-surfaces-algebriques
    kind: builds-on
    recommended: primary
    note: >-
      Clebsch's 1868 note introduced the geometric genus $p_g$ via the number of arbitrary
      coefficients in adjoint surfaces of order $n - 4$ passing through the double curves,
      corresponding to double integrals of algebraic surfaces. Picard extends this inquiry to
      single integrals of algebraic total differentials $\displaystyle\int P\,dx + Q\,dy$ on an algebraic
      surface, seeking the conditions under which they remain everywhere finite (integrals of
      the first kind).

significance: >-
  Presented to the Académie des sciences by Hermite on 1 December 1884, this note marks the
  birth of Émile Picard's theory of algebraic differentials on surfaces. Where Riemann had studied
  abelian integrals on curves and Clebsch investigated double integrals on surfaces,[1] Picard opened
  a new direction by asking whether an algebraic surface admits single integrals of total
  differentials $\displaystyle\int P\,dx + Q\,dy$ that remain everywhere finite. He showed that
  unlike algebraic curves, a general surface admits no such integrals of the first kind, and
  established that surfaces uniformizable by abelian functions of two parameters must possess
  exactly two independent integrals—a foundation developed systematically in his 1885 memoir.[2]

