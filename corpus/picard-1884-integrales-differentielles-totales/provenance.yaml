  note: >-
    Émile Picard, "Sur les intégrales de différentielles totales algébriques",
    Comptes rendus hebdomadaires des séances de l'Académie des sciences, tome 99,
    2e semestre, séance du lundi 1er décembre 1884 (n° 22), pp. 961–963. COMPLETE:
    all pages 961–963 of the note are transcribed. \origpage markers run 961–963
    with no gaps or duplicates, pipeline/houselint.py passes over the whole file,
    and the mechanical checks (display pairing, $ parity, brace balance, seamless page
    boundary joins) pass.

    HOW THESE PAGES WERE PRODUCED. Read directly from high-resolution BnF/Gallica IIIF
    scans (ark:/12148/bpt6k3055h, vues f961–f963) under the /transcribe skill using
    Gemini 3.8 Flash with high thinking effort. An upfront Phase 0 Global Notation Scan
    established notation.md across all three pages before fragment generation.

    UNCERTAINTY FLAGS: ZERO. Every formula, subscript, prime, differential, and punctuation
    mark was verified against the high-resolution scan images.

    QUOTATION AND APPARATUS CONVENTIONS. The communication's opening « on p. 961, paragraph-initial
    » markers on pp. 961, 962, and 963, and the terminal closing » on p. 963 are transcribed
    faithfully per HOUSESTYLE R22. Unrelated surrounding material in the Comptes rendus issue
    (the preceding terrestrial magnetism paper and footnote (1) on p. 961, the running heads,
    the issue footer on p. 961, and M. G. Fouret's note on p. 963) is omitted.

    APPARENT PRINTER'S ERROR REPRODUCED FAITHFULLY (R4):
      - p. 962: "trouver trois polynômes \theta_{1}, \theta_{2}, \theta_{3}, \theta_{4}".
        The print sets "trois" where four polynomials are listed. Verified against the scan
        and preserved as printed.

