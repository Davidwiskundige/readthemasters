significance: >-
  The third of Poincaré's five complements to Analysis situs[1] applies the fundamental group of
  1895 to an algebraic surface, the double plane $z = \sqrt{F(x, y)}$. Its target is a gap in
  Picard's work[2]: Picard had shown that every linear cycle on the most general surface of its
  degree is homologous to zero, but a trivial fundamental group needs every cycle to be equivalent
  to zero. Following the branch points $a, \ldots, f$ of the curves $y = \text{const.}$ as $y$
  circles the singular values, Poincaré finds that branch points exchanged there become
  equivalent; so if $F$ is indecomposable the fundamental group reduces to the identity, and if
  $F$ has $n$ factors it has at most $2^{n-1}$ elements. At a conical point that may not be
  crossed only $(ad)^{2} \equiv 1$ holds, which he recognizes as the torsion of Heegaard's
  manifold[3][4]. Zariski[5] and van Kampen[6] later used the same procedure for plane curves.
