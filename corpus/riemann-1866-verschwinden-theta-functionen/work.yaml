  note: Riemann's 1857 memoir on Abelian functions, whose second division established
    the vanishing theorem for theta functions. Here Riemann provides a rigorous and
    complete proof covering the special cases of the Jacobi inversion problem.
significance: In this paper Riemann resolves the exceptional case in his theta-vanishing
  theorem from the 1857 "Theorie der Abel'schen Functionen". By determining the exact
  conditions under which the Riemann theta function vanishes identically on a Riemann
  surface, he completes the solution to the Jacobi inversion problem and introduces
  the fundamental concept now known as the Riemann singularity theorem.
