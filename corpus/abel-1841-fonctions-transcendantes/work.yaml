# NOTE ON DIRECTION: the true citation runs the other way — Abel's 1828 note cites THIS memoir, in
# a footnote on its opening page, as the work he had presented in Paris at the end of 1826. That
# edge cannot be authored on the 1828 note, because `relations` must point backward by publication
# year and this memoir did not appear until 1841, twelve years after Abel's death. The edge is
# therefore recorded here, in the direction the schema allows; the `note` below states the actual
# relationship, and the reading order it produces (note first, then memoir) is the right one either
# way. See the transcription's provenance for the fuller account.
relations:
  - to: abel-1828-remarques
    kind: builds-on
    recommended: primary
    note: >-
      Abel's own published announcement of this memoir. Written after it and printed thirteen years
      before it, the 1828 note states the theorem and works out the case of a single square root in
      eleven pages; this memoir is the full theory it promises.

significance: 'This is Abel''s celebrated Paris memoir, source of what is now called
  Abel''s theorem: a sum of any number of integrals of a given algebraic function
  can be expressed, up to an algebraic and logarithmic remainder, through a fixed
  number of similar integrals, however many terms are summed — a vast generalization
  of the addition theorems for elliptic integrals that Legendre had developed, which
  Abel names as his point of departure in the opening lines.[1] Abel presented the
  manuscript to the Académie des sciences on 30 October 1826, with Cauchy and Legendre
  appointed as referees, and remained in Paris for months awaiting their report, in
  increasing poverty.[2] Cauchy mislaid the manuscript, and no report followed. In
  March 1829, weeks before Abel''s death, Jacobi wrote to Legendre asking what had
  become of "this discovery, perhaps the most important that mathematics has made
  in the century in which we are living"; Cauchy and Legendre finally reported on
  29 June 1829.[3] The manuscript itself was located only after a formal request from
  the Norwegian government to the French authorities, and the memoir was finally printed
  in 1841, twelve years after Abel''s death.[2][3] Abel''s own manuscript later vanished
  again from the Academy''s papers and was not rediscovered until 1952, found among
  the papers of Guglielmo Libri in Florence.[2][4]'
significance_sources:
- citation: 'A. Del Centina, "Abel''s manuscripts in the Libri collection: their history
    and their fate", in "Il manoscritto parigino di Abel preservato nella Biblioteca
    Moreniana di Firenze", Leo S. Olschki (2002) — the definitive account of the memoir''s
    submission, loss, and the 1952 rediscovery of Abel''s own manuscript copy in Florence.'
  url: https://abelprize.no/sites/default/files/2021-05/A.%20Del%20Centina%20Abel's%20manuscripts%20in%20the%20Libri%20collection-%20their%20history%20and%20their%20fate;%20in%20Il%20manoscritto%20parigino%20di%20Abel%20preservato%20nella%20.pdf
