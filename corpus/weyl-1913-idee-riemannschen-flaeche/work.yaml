significance: >-
  Hermann Weyl's 1913 book created the modern theory of Riemann surfaces and formulated
  the first rigorous intrinsic definition of a two-dimensional complex manifold.[1]
  Following Bernhard Riemann's pioneering work, the subject had fractured: while Alfred Clebsch,
  Alexander Brill, and Max Noether reformulated the theory in the language of algebraic curves
  in the plane, and Karl Weierstrass based function theory on power series, the Riemann surface
  itself was often treated merely as an auxiliary device or visual aid distilled a posteriori
  from an algebraic relation.[1] Felix Klein had vigorously pushed back in 1882, insisting that
  to recover Riemann's true train of thought the surface must be conceived as the *prius*—an entity
  existing prior to any functions upon it—though Klein had relied on physical intuition of
  fluid flows on surfaces in space.[2]

  Weyl took up Klein's foundational conviction and brought it to rigorous mathematical fruition.
  By severing all dependence on an ambient embedding or multi-sheeted branched coverings of the plane,
  Weyl defined a Riemann surface abstractly as a two-dimensional topological manifold covered by
  overlapping coordinate charts with conformal transition functions, creating the prototype
  for the modern concept of a manifold.[1] In Part I, he developed the combinatorial topology
  of surfaces, triangulations, and universal coverings, giving a geometric foundation to the
  Koebe–Poincaré uniformization theorem. In Part II, he harnessed David Hilbert's 1904 direct
  method in the calculus of variations to rehabilitate the Dirichlet principle, introducing
  orthogonal projection of differentials (the forerunner of Hodge theory and Weyl's lemma)
  to construct harmonic potentials, Abelian integrals, and algebraic functions on abstract
  surfaces.[3]
