significance: >-
  This eleven-page note is where Abel first put his general addition theorem into print. He had
  presented the full memoir to the Académie des sciences in Paris at the end of 1826, and says so
  in a footnote on its opening page; that memoir was not printed until 1841, twelve years after his
  death, so for a generation this article in Crelle's Journal was the only published statement of
  the result.[1] Abel promises the general proof "in one of the following numbers of this journal"
  and never gives it — he died in April 1829 — so what survives here is the one case he works out
  in full: integrals whose only irrationality is a square root,
  $\displaystyle\int \frac{r \partial x}{\sqrt{\varphi x}}$, with $\varphi x$ a polynomial of degree
  $2\nu-1$ or $2\nu$.[2] The heart of the article is
  the observation Abel reaches in §9 and states as Théorème VIII: however many such integrals are
  added together, their sum reduces to $\nu-1$ integrals of the same kind plus an algebraic and
  logarithmic term, and that count does not depend on how many integrals one began with. It is an
  invariant of $\varphi x$ alone. For the curve $y^2 = \varphi x$ that number is what Riemann and
  then Clebsch would later call the genus.[3]

significance_sources:
  - citation: >-
      Abel's own footnote to p. 313 of this article: "J'ai presenté un mémoire sur ces fonctions à
      l'académie royale des sciences de Paris vers la fin de l'année 1826." The memoir he points to
      is the Paris memoir, printed only in 1841; its publication history is set out in this corpus
      under abel-1841-fonctions-transcendantes.
  - citation: >-
      J. J. O'Connor and E. F. Robertson, "Niels Henrik Abel", MacTutor History of Mathematics
      Archive, University of St Andrews — for Abel's death in April 1829 and the fate of the Paris
      memoir. Abel's unfulfilled promise of a proof, and the degree conditions on the function
      transcribed here, are read directly from the text of this article (§1 and Théorème VIII).
    url: "https://mathshistory.st-andrews.ac.uk/Biographies/Abel/"
  - citation: >-
      S. L. Kleiman, "What is Abel's Theorem Anyway?", in O. A. Laudal and R. Piene (eds.), "The
      Legacy of Niels Henrik Abel: The Abel Bicentennial, Oslo, 2002", Springer (2004) — traces the
      several distinct theorems that have been called Abel's theorem, gives the hyperelliptic case
      Abel works out here its due attention, and follows the number of irreducible integrals through
      to Clebsch's genus.
    url: "https://link.springer.com/chapter/10.1007/978-3-642-18908-1_11"

