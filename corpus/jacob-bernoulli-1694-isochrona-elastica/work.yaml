significance: >-
  Leibniz had closed his 1689 isochrone paper by posing a harder problem: to find the paracentric
  isochrone, a curve of descent along which a heavy body approaches (or recedes from) a fixed point
  at a uniform rate. Here Jacob Bernoulli gives the first complete solution and construction —
  something, he notes, neither Leibniz nor anyone else had managed — reducing the problem first to a
  first-order differential equation and then, in its most celebrated step, to the rectification of
  the elastic curve (the elastica), whose arc length he expresses by an integral of the form
  $\displaystyle\int \frac{a^{2}\,du}{\sqrt{a^{4}-u^{4}}}$. In a sequel three months later he reduced the same
  construction to the rectification of a new algebraic curve he named the lemniscate. Integrals of
  this lemniscatic type are the ones Fagnano (1718) and then Euler (1751/1761) turned into the
  addition theorems at the origin of the theory of elliptic functions, and through Abel, Jacobi and
  Riemann into the modern theory of elliptic and Abelian functions.[1]

