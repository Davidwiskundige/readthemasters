translations:
  en:
    status: ai-draft
    model: claude-opus-5
    effort: high
    prompt_version: translate-v1
    submitted_via: skill
    source: transcription
    produced: "2026-09-03"
    glossary: glossary.yaml
    uncertainty_flags: 0
    note: >-
      Translated from our own original.tex, never from any published translation. The glossary was
      written as part of this pass and deliberately mirrors the Riemann 1857 and Clebsch 1864
      glossaries already in the corpus for every shared term, since this note is built directly on
      both: Knotenpunkt = "node", Rückkehrpunkt = "cusp", Schaar = "family", Kegelschnitt = "conic",
      Grösse = "quantity", Klasse = "class".

      Four renderings a reviewer should weigh. (1) Geschlecht = "genus" — Clebsch's coinage, which
      Noether extends here from curves to surfaces and then to manifolds of any dimension; Cayley's
      English word for the same number was "deficiency", but "genus" is the literal rendering of the
      German and the one that survived. (2) eindeutig = "one-to-one" — of a correspondence the word
      means single-valued in both directions ("Punkt für Punkt eindeutig ... und umgekehrt"), a
      different sense from the one in the Riemann 1857 glossary, where the same adjective qualifies
      a function and is rendered "uniquely determined". (3) Abbildung = "representation", Cayley's
      and Salmon's period word for carrying a surface onto a plane, not the modern "map". (4)
      Querschnitt (p. 304) = "cross-section", a plane section of a skew surface — NOT Riemann's
      Querschnitt, which this corpus renders "crosscut". That false friend across two works sitting
      side by side is flagged in the glossary and in the file header.

      Three text inserts were translated under HOUSESTYLE R21: the ordinal suffix (ter/ten → th),
      and \text{auf} → \text{on} and \text{mal,} → \text{times,} in the p. 300 array. The two ditto
      marks \text{„} in that same array were NOT translated — they are the edition's punctuation,
      not language, on the same reasoning by which the „…“ quotation glyphs around the four theorems
      are kept (R22, following jacobi-1832-considerationes). texcompare ignores the content of an
      insert, so all five of these were checked by hand.

      Word order is constrained by the preservation check, which compares the sequence of math
      spans. The last sentence of §. IV (p. 306) is the clearest case: the natural English "thinks
      of ξ as put in place of x" would reverse two spans the print puts the other way round, so it
      reads "$x_1, x_2, x_3, x_4$ as replaced respectively by $\xi_1, \xi_2, \xi_3, \xi_4$" instead.
      The two theorem statements broken across pp. 301–302 likewise keep a slightly Germanic order
      so each \origpage marker still falls at the printed break.

      The print's own errors are carried across rather than repaired (R4), as the transcription
      carries them. Three are visible in the English prose and should not be read as translation
      slips: the missing verb on p. 298 ("If $f = o$ the homogeneous equation of a curve …"), the
      full stop before a lowercase "which" on p. 300, and Theorem 3's quotation left unclosed on
      p. 302. The rest sit inside preserved formulae.

      STATUS ai-draft. No human has read this against the original yet. pipeline/texcompare.py and
      pipeline/houselint.py both pass over the file.

transcription:
  status: skimmed
  model: claude-opus-5
  effort: high
  prompt_version: transcribe-v1
  submitted_via: skill
  produced: "2026-09-02"
  verification:
    flagged_pages: [298, 300, 301, 302, 304, 305]
    date: "2026-09-02"
  uncertainty_flags: 0
  reviewers:
    - name: DvdL
      level: skimmed
      date: "2026-09-02"
      note: >-
        Read against the scan. Found two errors every automated pass had missed or got wrong: the
        apparent prime on F (p. 301) is ink missing from the top of the letter, not a mark; and the
        ditto in the p. 300 array repeats "mal" from the row above, with "etc." following that
        column rather than folded into one run with the ditto. Both corrected. Not a word-for-word
        proofread of all nine pages.
  note: >-
    Max Noether's "Zur Theorie der algebraischen Functionen mehrerer complexer Variabeln",
    Göttinger Nachrichten 1869, pp. 298-306 — the complete paper, 9 of 9 pages. Read from
    one text-block crop per page of the GDZ scan (PPN252457072_1869, images 300-308).
    \origpage markers run 298-306 with no gaps; pipeline/houselint.py passes over every fragment
    and over the assembled file.

    HOW THESE PAGES WERE PRODUCED. Two isolated batch subagents under the /transcribe skill —
    pp. 298-301 and pp. 302-306 — each given only prompts/transcribe-chat.md, the
    transcription-relevant house-style extract, its own page images, and (for the second batch)
    this work's notation.md as written from the first batch's report. The orchestrating session
    read no scan image at any point. Both batches were then re-read against the scans by a
    verification subagent, and the assembled file was proofread once more WITHOUT the scans.

    A CAVEAT ON THIS SCAN'S RESOLUTION, which a reviewer should weigh. These pages are unusually
    tall relative to their width, so capping the long edge at 1568px leaves only about 850px of
    text width — against roughly 1180px for a more typical page. Both batches reported that this
    is comfortable for the German prose but NOT for the mathematics: every one of their 25
    magnification crops went to a subscript, an exponent, or a small punctuation mark, and both
    hit the 3-crops-per-page cap on nearly every page. The transcription carries zero uncertainty
    flags, but that reflects magnification resolving each doubt, not an easy scan.

    APPARENT PRINTER'S ERRORS reproduced faithfully, not corrected (R4). Each was confirmed
    against the scan at magnification:
    (a) p. 298 - "mit d Doppel- und r Rückkehrpunkten", with the verb "ist" missing before the
    following clause.
    (b) p. 300 - "Singularitäten enthalten. die denen analog wären": a full stop where a comma
    belongs, with the following "die" left lowercase.
    (c) p. 301 - the substitution display opens two parentheses and closes only one.
    (d) [WITHDRAWN - was not a printer's error. See CORRECTIONS FROM HUMAN REVIEW below.]
    (e) p. 302 - Theorem 3's quotation is opened and never closed, though Theorem 2's on the same
    page is closed.
    (f) p. 302 - display (1) sets "φ_i(μ,ν)" with a comma and "φ'_i(μν)" without one, and sets a
    multiplication period on the first term but none on the second.
    (g) p. 302 - "ψ(μ,ν) = 0" uses a DIGIT zero where the work sets the letter o for zero
    everywhere else. Magnified, the glyph is taller and more oval than the o of "p = o" two lines
    below.
    (h) p. 304 - "dem Theorem 3) analogen Theoremen", a closing parenthesis where every other
    back-reference reads "Theorem 3.".
    (i) p. 305 - display (4) row 3 reads "r x_3" where the five parallel rows read "ϱ x_i"; the
    glyph has no bowl and no descender, so it is a wrong sort rather than a broken ϱ.
    (j) p. 305 - a stray comma in "ξ_1, ξ_4 A" where the line above sets "ξ_1 ξ_4 B" with none,
    and a missing comma in "Φ(x_1 x_2, x_3, x_4)".

    TWO INCONSISTENCIES IN THE PRINT that a proofread flagged as suspected transcription errors
    and the scan then confirmed as the author's or compositor's own:
    - p. 302, display (1): the expansion descends in λ as λ^r, λ^(r-1), … but its final
    coefficient is indexed σ, not r. A degree-r polynomial ending in the σ-th coefficient does not
    close, and r is already the paper's dimension parameter. Both exponents were magnified against
    the σ on the following line: they are unmistakably italic r (open stem-and-shoulder) and the σ
    is a closed bowl. The print really does mix the two indices. Left as printed; worth a
    mathematician's eye.
    - p. 300: Theorem 1 is labelled "Theorem 1:" with no period before the colon, where Theorems
    2, 3 and 4 all read "Theorem N.:". Verified by counting dots against a same-typesetting
    control: two for Theorem 1, three for Theorem 3.

    THE TITLE. The print sets "Variabeln" (letterspaced, so unambiguous letter by letter), not the
    "Variablen" given by the EuDML catalogue record. work.yaml follows the print (R12: the
    edition's own orthography is kept).

    CORRECTIONS FROM HUMAN REVIEW (2026-09-02). A contributor read the draft against the scan and
    found two errors that every automated pass had missed or got wrong:

    1. p. 301, the "F'" listed above as printer's error (d). IT IS NOT A PRIME. Ink is missing from
    the top of the F, and the surviving fragment of its upper arm reads as a detached mark. The
    correct reading is plain F, consistent with every other occurrence in the paper. Corrected.
    This one is worth dwelling on: THREE separate AI passes examined that glyph — the transcribing
    batch, the next batch corroborating from its own pages, and the verification pass — and all
    three concluded it was cleanly inked type and reproduced it faithfully under R4. Their shared
    reasoning was "the mark is well-inked and at cap height, therefore it was set", a test that
    cannot tell ink that was PUT there from ink that was LEFT BEHIND when a letter broke up. The
    corroboration between passes made the wrong answer look stronger rather than weaker, because
    each pass applied the same flawed test. Recorded in notation.md as a failure mode.

    2. p. 300, the ditto array. The ditto in the last column repeats the word "mal" from the row
    above, and "etc." follows AFTER that column, where "mal" would have been written. The draft
    folded the ditto and "etc." into a single text run, losing the alignment that carries the
    meaning. Corrected to give the ditto its own cell.

    STATUS skimmed. A contributor has read the draft against the scan and corrected what that
    found (see reviewers). It is not a word-for-word verification of all nine pages, which is what
    `verified` would require. The flagged pages are where a further reviewer should start, and p. 302's display (1) — which descends in lambda
    as r, r-1 but indexes its final coefficient with sigma — remains the passage most worth a
    specialist's attention.
