significance: >-
  The last of Poincaré's five complements to Analysis situs[1], and the paper that ends with the
  question now known as the Poincaré conjecture. The second complement[2] had introduced torsion
  coefficients and closed by asserting that a manifold whose Betti numbers and torsion coefficients
  are all 1 is homeomorphic to the hypersphere. Here Poincaré tests that claim on three-dimensional
  manifolds. § 2 studies a manifold through a family of surfaces $\varphi = t$ and follows how
  their connectivity changes as $t$ passes a singular value; §§ 3–4 work out which cycles on a
  closed surface are homologous or equivalent to simple closed curves, or to curves that do not
  meet, representing the surface by a Fuchsian polygon; § 5 builds three-dimensional manifolds from
  surfaces that grow and shrink as $t$ runs from 0 to 1. In § 6 one such manifold has Betti number
  and torsion coefficients equal to 1, yet its fundamental group contains the icosahedral group, so
  it is not simply connected: homology alone does not characterize the sphere. The paper closes by
  asking whether a manifold whose fundamental group reduces to the identity could still fail to be
  simply connected, and leaves it there, as a question that would lead too far.
