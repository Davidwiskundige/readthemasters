  note: Riemann's 1851 dissertation founded the geometric theory of functions and
    Riemann surfaces upon the Dirichlet principle; Hilbert's 1904 paper provides the
    rigorous direct variational proof that rehabilitates Riemann's foundational method.
- to: weierstrass-1895-dirichletsche-princip
  kind: builds-on
  note: Weierstrass's 1870 critique demonstrated that the Dirichlet integral need
    not attain its minimum without additional conditions; Hilbert directly addresses
    and overcomes Weierstrass's objection using the direct method in the calculus
    of variations.
significance: In this landmark 1904 paper in the Mathematische Annalen, David Hilbert
  provides the first rigorous justification of the Dirichlet principle, rehabilitating
  the foundational method used by Bernhard Riemann in 1851 that had been called into
  question by Karl Weierstrass in 1870.[1] Rather than seeking harmonic functions
  via indirect boundary integral equations (such as Schwarz's alternating method or
  Neumann's method), Hilbert created the "direct method in the calculus of variations."[2]
  By constructing minimizing sequences of functions and proving their compactness
  and convergence to a genuine harmonic minimizer, Hilbert not only rescued Riemann's
  approach to function theory and conformal mapping, but also laid the cornerstone
  for modern functional analysis, Sobolev spaces, and the direct methods of the calculus
  of variations in the twentieth century.[1]
