# Controlled vocabulary for corpus metadata facets.
# The validator rejects any work.yaml value not listed here (prevents facet drift).
# Add new values via a pull request; keep keys stable (they appear in URLs and filters).

disciplines:
  mathematics: Mathematics
  physics: Physics

tags:
  # mathematics
  analysis: Analysis
  geometry: Geometry
  number-theory: Number theory
  algebra: Algebra
  topology: Topology
  probability: Probability
  foundations: Foundations & logic
  # physics
  mechanics: Mechanics
  thermodynamics: Thermodynamics
  statistical-mechanics: Statistical mechanics
  electromagnetism: Electromagnetism
  optics: Optics
  relativity: Relativity
  quantum: Quantum theory

types:
  paper: Paper
  book: Book
  chapter: Chapter
  letter: Letter
  lecture: Lecture
  manuscript: Manuscript

# Kinds of dependency edge in a work's `relations:` list (each edge points backward in time to an
# earlier corpus work). `cites` is objective — the transcribed text references that work; `builds-on`
# is a curated conceptual dependency (editorial, like `significance`).
relation_kinds:
  cites: Cites
  builds-on: Builds on

# ISO 639-1 codes -> display name
languages:
  de: German
  fr: French
  en: English
  la: Latin
  it: Italian
  ru: Russian

# Publication venues. Normalize aggressively — one canonical key per venue.
#
# An entry may be a bare string (the full title) OR an object with journal metadata used by the
# /journals/ pages: name (required), aka, kind (periodical|book|manuscript, default periodical),
# founded/ceased, publisher, place, note, and archives (repositories hosting the digitized full
# run, each {label, url}). The `book`/`manuscript` sentinels set kind so /journals/ excludes them.
venues:
  crelle:
    name: "Journal für die reine und angewandte Mathematik (Crelle's Journal)"
    aka: "Crelle's Journal"
    founded: 1826
    publisher: "August Leopold Crelle (founder)"
    place: "Berlin"
    note: >-
      Founded by August Leopold Crelle in 1826, the oldest mathematics journal still in print and
      an early home of Abel, Jacobi, Dirichlet and Steiner.
    archives:
      - label: "EuDML"
        url: "https://eudml.org/journal/10147"
      - label: "GDZ (Göttingen)"
        url: "https://gdz.sub.uni-goettingen.de/volumes/id/PPN243919689"
      - label: "Wikisource"
        url: "https://de.wikisource.org/wiki/Journal_für_die_reine_und_angewandte_Mathematik"
  annalen-der-physik:
    name: "Annalen der Physik"
    founded: 1799
    place: "Leipzig / Berlin"
    note: >-
      A leading German physics journal since 1799; its 1905 volume carried Einstein's annus
      mirabilis papers.
    archives:
      - label: "Wiley Online Library"
        url: "https://onlinelibrary.wiley.com/journal/15213889"
      - label: "Internet Archive"
        url: "https://archive.org/search?query=Annalen+der+Physik"
  goettingen-abhandlungen:
    name: "Abhandlungen der Königlichen Gesellschaft der Wissenschaften zu Göttingen"
    place: "Göttingen"
    publisher: "Königliche Gesellschaft der Wissenschaften zu Göttingen"
    note: >-
      Proceedings of the Göttingen Academy of Sciences (founded 1751), the venue for major works
      by Gauss, Riemann and others.
    archives:
      - label: "GDZ (Göttingen)"
        url: "https://gdz.sub.uni-goettingen.de/id/PPN250442582"
      - label: "EuDML"
        url: "https://eudml.org/journal/10140"
  goettingen-nachrichten:
    name: >-
      Nachrichten von der Königl. Gesellschaft der Wissenschaften und der
      Georg-Augusts-Universität zu Göttingen
    aka: "Gött. Nachr."
    founded: 1845
    place: "Göttingen"
    publisher: "Königliche Gesellschaft der Wissenschaften zu Göttingen"
    note: >-
      The Göttingen Academy's short-communications series, distinct from its Abhandlungen: the
      Nachrichten carried brief notes and session reports, the Abhandlungen full-length memoirs.
    archives:
      - label: "GDZ (Göttingen)"
        url: "https://gdz.sub.uni-goettingen.de/id/PPN252457072"
      - label: "EuDML"
        url: "https://eudml.org/journal/10176"
  phil-trans:
    name: "Philosophical Transactions of the Royal Society"
    aka: "Phil. Trans."
    founded: 1665
    place: "London"
    publisher: "Royal Society"
    note: >-
      The first scientific journal in English, published continuously since 1665.
    archives:
      - label: "Royal Society — Philosophical Transactions (1665–1886)"
        url: "https://royalsocietypublishing.org/journal/rstl"
      - label: "Internet Archive"
        url: "https://archive.org/search?query=Philosophical+Transactions+of+the+Royal+Society"
  comptes-rendus:
    name: "Comptes rendus de l'Académie des sciences"
    aka: "Comptes rendus"
    founded: 1835
    place: "Paris"
    publisher: "Académie des sciences"
    note: >-
      The weekly proceedings of the French Academy of Sciences, a rapid-publication venue since
      1835.
    archives:
      - label: "Gallica (BnF)"
        url: "https://gallica.bnf.fr/ark:/12148/cb343481087/date"
      - label: "Biodiversity Heritage Library"
        url: "https://www.biodiversitylibrary.org/bibliography/4466"
  acta-mathematica:
    name: "Acta Mathematica"
    founded: 1882
    place: "Stockholm"
    publisher: "Gösta Mittag-Leffler (founder)"
    note: >-
      Founded by Gösta Mittag-Leffler in 1882; its early volumes published Poincaré, Cantor and
      Hadamard.
    archives:
      - label: "Project Euclid"
        url: "https://projecteuclid.org/journals/acta-mathematica/issues"
  annali-di-matematica:
    name: "Annali di Matematica Pura ed Applicata"
    aka: "Annali di Matematica"
    founded: 1858
    place: "Milan / Rome"
    note: >-
      Italy's principal mathematics journal, continuing the Annali di Scienze Matematiche e Fisiche
      founded by Barnaba Tortolini in 1850; from 1858 edited by Brioschi, Betti, Casorati and
      Genocchi, and from 1868 (second series) published in Milan.
    archives:
      - label: "EuDML"
        url: "https://eudml.org/journal/10231"
      - label: "MDZ (Munich)"
        url: "https://www.digitale-sammlungen.de/en/search?query=Annali+di+matematica+pura+ed+applicata"
  mathematische-annalen:
    name: "Mathematische Annalen"
    founded: 1868
    note: >-
      Founded in 1868 by Clebsch and Neumann; under Klein and Hilbert one of the foremost
      mathematics journals.
    archives:
      - label: "EuDML"
        url: "https://eudml.org/journal/10142"
      - label: "GDZ (Göttingen)"
        url: "https://gdz.sub.uni-goettingen.de/volumes/id/PPN235181684"
  giornale-letterati-italia:
    name: "Giornale de' letterati d'Italia"
    founded: 1710
    ceased: 1740
    place: "Venice"
    publisher: "Apostolo Zeno, Scipione Maffei, Antonio Vallisneri (founders)"
    note: >-
      A Venetian learned journal (1710–1740) that carried Fagnano's lemniscate work.
    archives:
      - label: "Internet Archive"
        url: "https://archive.org/search?query=%22Giornale+de%27+letterati+d%27Italia%22"
  acta-eruditorum:
    name: "Acta Eruditorum"
    founded: 1682
    ceased: 1782
    place: "Leipzig"
    publisher: "Otto Mencke (founder)"
    note: >-
      The first scientific journal of the German lands (1682–1782), a principal venue for Leibniz
      and the Bernoullis.
    archives:
      - label: "Internet Archive"
        url: "https://archive.org/search?query=Acta+Eruditorum"
  novi-commentarii-petropolitanae:
    name: "Novi Commentarii Academiae Scientiarum Imperialis Petropolitanae"
    aka: "Novi Commentarii Petropolitanae"
    founded: 1750
    ceased: 1776
    place: "Saint Petersburg"
    publisher: "Imperial Academy of Sciences, St Petersburg"
    note: >-
      The St Petersburg Academy's proceedings (1750–1776), in which Euler published prolifically.
    archives:
      - label: "Biodiversity Heritage Library"
        url: "https://www.biodiversitylibrary.org/bibliography/9527"
  memoires-divers-savants:
    name: >-
      Mémoires présentés par divers savants à l'Académie royale des sciences de l'Institut de
      France (Sciences mathématiques et physiques)
    aka: "Mémoires des savants étrangers"
    place: "Paris"
    publisher: "Académie royale des sciences de l'Institut de France"
    note: >-
      A slow-appearing series for memoirs by non-members reported on by the Academy; Abel's Paris
      memoir waited from its 1826 submission to 1841 publication here.
    archives:
      - label: "Gallica (BnF)"
        url: "https://gallica.bnf.fr/ark:/12148/cb328135052/date"
  book:
    name: "(published as a book / monograph)"
    kind: book
  manuscript:
    name: "(unpublished manuscript)"
    kind: manuscript
