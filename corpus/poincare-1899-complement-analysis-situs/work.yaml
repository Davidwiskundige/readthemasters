significance: >-
  The first of Poincaré's five complements to Analysis situs[1], and the paper in which homology
  becomes combinatorial. Heegaard's dissertation of 1898[2] had declared the duality theorem of
  1895 false and its proofs worthless. Poincaré replies by separating two definitions of the Betti
  numbers, Betti's own and his by homologies, which may be divided by an integer, and by granting
  that his earlier proof does not hold as it stands (§ I). He answers by cutting the manifold into a
  polyhedron and recording only which cells bound which: the schéma of § II attaches to each
  incident pair of cells a number $\varepsilon$ equal to $+1$, $-1$ or $0$, and a congruence
  $\equiv$ lists a cell's boundary. From these tables he defines the reduced Betti numbers (§ III),
  shows that subdividing the polyhedron does not change them (§§ IV–VI), and builds the reciprocal
  (dual) polyhedron, whose cells correspond to those of the original in complementary dimension
  (§ VII), to prove the duality theorem afresh (§ VIII). § IX isolates the homologies that hold
  only after division by an integer, the phenomenon later called torsion, and reduces the question
  of when the two definitions agree to the greatest common divisors of determinants taken from the
  incidence tables. § X gives an arithmetic proof of one of the theorems of § VII, and § XI argues
  that every manifold can be subdivided into generalized tetrahedra, so that the method always
  applies.
