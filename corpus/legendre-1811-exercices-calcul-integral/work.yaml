significance: >-
  This is the first volume of the book in which Legendre gathered, rebuilt and extended his
  decades of work on integrals that cannot be done in closed form. In the opening pages he
  traces the history he builds on: Fagnano's comparison of arcs of the lemniscate, Euler's
  integral of a differential equation made of two such terms, Landen's reduction of the
  hyperbola to the ellipse, and Lagrange's transformations; he then recalls his own
  memoirs of 1786 and 1793 and says that returning to the subject after a long interruption
  led him to improve it, above all for the third species, and to present it in a new
  order.[1] The first part classifies the integrals $\displaystyle\int\frac{P\,dx}{R}$, with $P$
  rational and $R$ the square root of a quartic, reduces them to three species of elliptic
  function, compares and approximates each species by sequences of moduli of the kind that
  Landen's transformation gives, and applies them to the lemniscate, the pendulum and the surfaces of the cone and the ellipsoid.
  The second part treats two kinds of definite integral to which Legendre gives the name
  Eulerian, the first denoted $\left(\frac{p}{q}\right)$ and the second written
  $\Gamma(a)$ and regarded as a continuous function of $a$, with a table of $\log\Gamma(a)$
  for computing it.[2] The third part, on quadratures, supplies the means of evaluating
  transcendents that the tables do not cover, a general formula expressing an integral by
  finite differences with corrections, and then a collection of definite integrals
  taken from Euler and Laplace.[3] Abel's memoir of 1827 on elliptic functions, also in this
  corpus, names Legendre as the one who had gone deepest into these functions, and cites
  this book;[4] Jacobi's Fundamenta nova of 1829, also here, calls him the founder of the
  theory of elliptic functions.[5]

