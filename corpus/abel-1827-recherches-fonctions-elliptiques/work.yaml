significance: >-
  Here Abel turns Legendre's elliptic integral upside down. Legendre had spent decades studying
  the integral $\displaystyle\int \frac{\partial\theta}{\sqrt{1-c^{2}\sin^{2}\theta}}$ as a
  function of its upper limit; Abel proposes instead, in the opening pages, to study the inverse
  function $\Phi\alpha$, defined by $x=\Phi\alpha$ and
  $\alpha=\displaystyle\int_{0}\frac{\partial x}{\sqrt{[(1-c^{2}x^{2})(1+e^{2}x^{2})]}}$, together with its
  companions $f\alpha$ and $F\alpha$.[1] It is the step that takes the integral
  $\displaystyle\int \frac{\partial x}{\sqrt{1-x^{2}}}$ to the sine, and it is what Abel builds everything else on. Once the
  functions are allowed imaginary arguments, as in §. I, they turn out to have two independent
  periods, $\omega$ and $\varpi$.[2] The rest of the article follows the consequences. §. II gives
  the multiplication formulas, expressing $\Phi(n\alpha)$ rationally in $\Phi\alpha$, $f\alpha$,
  $F\alpha$. §§. III–V take up the equations that arise when one divides the periods into equal
  parts, reduce the solution to a single further equation of degree $2n+2$, and solve it in
  special cases, notably the lemniscatic case $e=c$. For that case Abel states, on p. 146, that the
  whole circumference of the lemniscate can be divided into $m$ equal parts by ruler and compass
  for exactly those $m$ for which Gauss had shown it possible for the circle. §§. VI–VII end with
  other expressions for $\Phi(n\beta)$ and with expansions of the three functions in series and
  infinite products.[3] The article breaks off with "La continuation dans le cahier suivant": the
  second part appeared in volume 3 of the same journal (1828) and is not included here.[4] Abel
  died in April 1829, the year in which Jacobi's Fundamenta nova, developed independently,
  appeared and gave the theory of elliptic functions its other classic foundation.[5]

significance_sources:
  - citation: >-
      Read directly from the text of this article: the opening pages (pp. 101–103), where Abel
      reviews Euler, Lagrange and Legendre, takes Legendre's elliptic integrals as his starting
      point, and introduces "la fonction inverse" $\Phi\alpha$.
  - citation: >-
      Read directly from the text of this article: §. I, where the functions are extended to
      imaginary arguments (equations (7.) and (8.)) and the two periods $\omega$ and $\varpi$
      appear.
  - citation: >-
      Read directly from the text of this article: the section headings of §§. II–VII, the
      statement on p. 146 of the ruler-and-compass division of the lemniscate (which Abel
      compares explicitly with Gauss's theorem for the circle), and the series for $\omega/2$
      on the final page.
  - citation: >-
      Abel's closing note on p. 181, "La continuation dans le cahier suivant"; the second part is
      the article of the same title in Crelle's Journal, vol. 3 (1828), pp. 160–190, as recorded
      in this work's publication entry.
  - citation: >-
      J. J. O'Connor and E. F. Robertson, "Niels Henrik Abel", MacTutor History of Mathematics
      Archive, University of St Andrews — for Abel's death in April 1829 and his work on elliptic
      functions in these years. The appearance of Jacobi's Fundamenta nova in 1829 is recorded in
      this corpus under jacobi-1829-fundamenta-nova.
