transcription:
  status: ai-draft
  model: claude-sonnet-5-5
  effort: medium
  prompt_version: transcribe-v1
  submitted_via: skill
  produced: "2026-10-07"
  verification:
    model: claude-sonnet-5-5
    flagged_pages: [101, 102, 103, 104, 106, 109, 111, 118, 119, 121, 122, 126, 128, 129, 131, 132, 133, 134, 136, 139, 140, 142, 143, 146, 147, 148, 151, 154, 156, 158, 159, 160, 162, 163, 164, 166, 169, 171, 172, 174, 175, 176, 177, 178, 179, 180]
    date: "2026-10-07"
  uncertainty_flags: 3
  note: >-
    Full French text of the first part of Abel's "Recherches sur les fonctions elliptiques",
    printed pages 101–181 (the article's first part; the second part is in Band 3, 1828,
    pp. 160–190, and is not transcribed here), from the original first printing in Crelle's Journal,
    Band 2, 2. Heft (1827), No. 12. Read from the GDZ scan PPN243919689_0002 (image numbers 113–193,
    3816×5596 px). Transcribed in seven batches of 9–12 pages by independent subagents sharing a
    notation glossary, then proofread as a whole without the scans, then verified page by page
    against the scans (20 verifiers, 4–5 pages each; every paragraph break and page opening was
    checked against the print). This is the AI's own verification, not a human review.
    Three readings are marked \uncertain (p. 104, p. 142, p. 146), none \illegible. The "flagged
    pages" are those carrying an \uncertain or an \ednote; there are 65 \ednote notes, almost all
    on printer's errors and ink damage reproduced as printed (ruling R4), not corrected.
    Running heads, sheet signatures, catchwords and the article number "12." are not transcribed.
    Notation kept faithful and recorded in notation.md: the differential is ∂ (\partial); Σ and Π
    are the letters Sigma and Pi with limits stacked on them and the index letter as a subscript of
    the whole stack (never \sum/\prod); the baseline multiplication "." is a tight period.
    KNOWN WEAK POINT for a human reviewer: the print sets a large Φ and a small φ for what appears
    to be one function, and the transcription follows the glyph as seen. That call was made at
    page-image resolution and was only partly settled by magnification (each page's budget was
    three crops, often spent elsewhere). Pages where the verifiers said they could not settle it:
    pp. 105, 106, 107, 108 (several text-line glyphs), 109 ((20.) left as large Φ), 110, 111, 112,
    124 ((62.) and one line of item 3)), 133 ((80.)), 142–144, 146–147, 155, and above all
    pp. 177–181, where the two glyphs look identical in the print and the Φ/φ assignment rests on
    the earlier pages' convention. Read the Φ/φ distinction on those pages as provisional.
    Other readings left for review: p. 134 (the χ / χ₁ subscripts are damaged in the print and are
    set to match eq. (79.), with an \ednote); p. 174 (the upper limit of the first product in the
    fα display is a printed α, confirmed on a second look, and is kept with an \ednote);
    p. 116 eq. (39.) (the subscript of the last P², n or a blurred m).

translations:
