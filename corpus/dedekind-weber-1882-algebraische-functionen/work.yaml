relations:
  - to: riemann-1857-abelsche-functionen
    kind: builds-on
    note: >-
      The introduction names the theory of algebraic functions of one variable "one of the
      principal results of Riemann's creation", identifies the authors' field of algebraic
      functions with Riemann's class of algebraic functions, and takes over "the number denoted
      by Riemann by $p$" as the genus. The whole memoir is a re-foundation of that theory, and
      the introduction says why: Riemann's approach "still offers certain difficulties as
      regards a rigorous foundation".
  - to: roch-1865-anzahl-constanten
    kind: builds-on
    note: >-
      §§ 28–30 prove "the Riemann-Roch theorem", named in the section headings, which the
      introduction describes in its usual form — the number of arbitrary constants in a function
      determined by its points of infinity — and which the memoir restates as a relation between
      the dimension and the order of a polygon class.

significance: >-
  Dedekind and Weber rebuild the theory of algebraic functions of one variable by pure algebra,
  because, they write, Riemann's theory still offers difficulties as regards a rigorous
  foundation. Borrowing the ideals of the theory of numbers, they show that ideals of integral
  functions factor uniquely into prime ideals, and then define a point of the Riemann surface as a
  consistent assignment of values to every function of the field. From these points they obtain
  the genus, the differentials of the first kind and a general proof of the Riemann-Roch
  theorem[1], without any appeal to continuity. The paper became a founding text of modern
  algebraic geometry: its purely algebraic Riemann surface, and the parallel it drew between
  algebraic functions and algebraic numbers, underlie the later theory of function fields and much
  of modern number theory.

significance_sources:
  - citation: >-
      Roch's determination of the number of arbitrary constants, the second half of the theorem
      proved here in §§ 28–30, in this corpus: "On the number of arbitrary constants in algebraic
      functions", Crelle's Journal 64 (1865).
    url: "/works/roch-1865-anzahl-constanten/"

