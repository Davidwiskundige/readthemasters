significance: >-
  The fourth of Poincaré's five complements to Analysis situs[1] turns the homology of the first
  two complements on the cycles that Picard had made central to the study of algebraic
  surfaces[2]. Poincaré treats the surface, a real four-dimensional variety, as fibred by the
  Riemann surfaces of its sections $y = \text{const.}$, and follows their cycles as $y$ circles the
  singular values $A_{i}$, where they undergo the substitutions of Picard's group. Its
  three-dimensional cycles correspond to the cycles invariant under that group; for the two-dimensional
  cycles he introduces the cycles évanouissants, those that disappear as the section degenerates
  at $A_{i}$; the one-dimensional cycles are again traced to invariants of Picard's group. This
  method of sections and vanishing cycles is the one Lefschetz developed into his topological
  theory of algebraic varieties[3].
