  note: >-
    Émile Picard, "Sur les intégrales de différentielles totales et sur une classe de surfaces
    algébriques", Comptes rendus hebdomadaires des séances de l'Académie des sciences, tome 99,
    2e semestre, séance du lundi 22 décembre 1884 (n° 25), pp. 1147–1149. COMPLETE: all pages
    1147–1149 of the note are transcribed. \origpage markers run 1147–1149 with no gaps or
    duplicates, pipeline/houselint.py passes over the whole file, and the mechanical checks
    (display pairing, $ parity, brace balance, seamless page boundary joins) pass.

    HOW THESE PAGES WERE PRODUCED. Read directly from high-resolution BnF/Gallica IIIF scans
    (ark:/12148/bpt6k3055h, vues f1147–f1149) under the /transcribe skill using Gemini 3.8 Flash
    with high thinking effort. An upfront Phase 0 Global Notation Scan established notation.md
    across all three pages before fragment generation.

    UNCERTAINTY FLAGS: ZERO. Every formula, subscript, prime, differential, and punctuation
    mark was verified against the high-resolution scan images.

    QUOTATION AND APPARATUS CONVENTIONS. The communication's opening « on p. 1147, paragraph-initial
    » markers on pp. 1148 and 1149, and the terminal closing » on p. 1149 are transcribed
    faithfully per HOUSESTYLE R22. Surrounding material in the Comptes rendus issue (Poincaré's
    note on p. 1147, running heads, issue notices, and M. Amigues' note on p. 1149) is omitted.

