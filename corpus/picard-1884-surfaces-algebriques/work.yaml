  note: Direct sequel to Picard's note of 1 December 1884. Where the earlier note
    introduced integrals of total differentials of the first kind on algebraic surfaces,
    this note applies the theory to surfaces whose coordinates are quadruple-periodic
    uniform functions of two parameters (Abelian functions), showing they possess
    exactly two independent integrals of the first kind and a double curve of order
    m(m-4)/2.
significance: 'Presented to the Académie des sciences by Hermite on 22 December 1884,
  three weeks after his initial announcement,[1] this second note applies Picard''s
  new theory of integrals of algebraic total differentials of the first kind to surfaces
  uniformizable by quadruple-periodic functions of two variables. Picard establishes
  necessary and sufficient conditions: the surface of degree $m$ must admit a double
  curve of order $\frac{m(m-4)}{2}$, have geometric genus 1 with no isolated double
  points, and possess exactly two independent integrals of the first kind with four
  pairs of simultaneous periods, a theorem central to his 1885 memoir.[2]'
