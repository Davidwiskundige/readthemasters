significance: >-
  In this five-page note in the Mathematische Annalen (1871), Hieronymus Georg Zeuthen clarifies
  a crucial ambiguity in the theory of algebraic surfaces by distinguishing singularities of
  punctual definition (such as pinch-points $j$, close-points $\chi$, and binodes $\eta$) from those
  of tangential definition ($j', \chi', \eta'$).[1] Applying Chasles's principle of correspondence,
  Zeuthen deduces the missing 26th reciprocal surface equation connecting the singularities of a
  surface and its dual. He shows that Cayley's 1869 formula would assign an impossible fractional
  coefficient ($25/3$) to close-points, demonstrating that earlier reciprocal formulations were
  incomplete.[2] This work provides the foundational singularity analysis underlying Zeuthen's
  proof that the arithmetic genus $p_a$ is a birational invariant—a key link between Riemann's
  genus and the Italian theory of surfaces.
