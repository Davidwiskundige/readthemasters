  submitted_via: skill
  produced: "2026-09-20"
  verification:
    model: gemini-3-8-flash
    flagged_pages: []
    date: "2026-09-20"
  uncertainty_flags: 0
  note: >-
    Full French text of Hieronymus Georg Zeuthen's five-page paper "Note sur la théorie de
    surfaces réciproques", printed pages 633–637, from the original first printing in
    Mathematische Annalen, Band 4 (Leipzig: B. G. Teubner, 1871). The paper provides critical
    clarifications on punctual vs tangential definitions of algebraic surface singularities
    (pinch-points, close-points, biplanes) and derives the 26th reciprocal surface equation
    connecting the singularities.

    ZERO UNCERTAINTY FLAGS: Every symbol and glyph was verified at 300 DPI scan resolution.
    The transcription contains no \uncertain{} and no \illegible. Key readings verified:
    - Summation operator uses capital Greek letter \Sigma (\Sigma, \Sigma') throughout, following
      Clebsch and Zeuthen's notation, not \sum.
    - Singularities notation: \chi, \chi' (Greek chi) for close-points and close-planes;
      \eta, \eta' for binodes and biplanes; \xi, \xi'; \varrho, \varrho'; \gamma, \gamma'.
    - In the formula \Sigma [2\mu + v] and \Sigma' [2\mu' + v'], Latin italic v and v' are confirmed.
    - German quotation marks „..." are preserved as literal Unicode per HOUSESTYLE R22, reflecting
      the Leipzig compositor's typeset.

    PRINTER'S ERRORS FAITHFULLY PRESERVED (HOUSESTYLE R4) WITH \ednote POPOVERS:
    - p. 635: "Les équations à la page 4" has a heavy ink batter/defect on the digit 4 (\ednote).
    - p. 635: "singularites" printed without acute accent on the e (\ednote).
    - p. 635: quotation opened with „Les équations lacks a closing quotation mark in print (\ednote).

