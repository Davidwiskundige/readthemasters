changelog:
  - date: "2026-07-30"
    summary: Transcription added (AI draft), pp. 608–612 (No. LX) from the 1744 Opera scan.
  - date: "2026-07-30"
    summary: Translation (en) added (AI draft).
  - date: "2026-07-31"
    summary: >-
      Removed the 1744 Opera's editorial footnotes (a)–(f) and their in-text reference marks from
      original.tex and en.tex, to keep the text faithful to Bernoulli's original 1694 Acta
      Eruditorum publication.
  - date: "2026-07-31"
    summary: >-
      Normalized the author's parenthetical insertions and value-substitutions to round parentheses
      ( ) throughout original.tex and en.tex, matching the original's typography (they had been set
      with square brackets).
  - date: "2026-07-31"
    summary: >-
      Re-transcribed from the ORIGINAL 1694 Acta Eruditorum (September, pp. 336–338, Internet Archive
      s1id13206610, leaves 0436–0438) after locating the paper — it is on the September p. 336 (after
      a medical review), not where the Opera's "Sept. p. 336" citation lands (the July p. 336).
      Adopted the Acta framing (running heading "Jac. B. Constructio curvae accessus …"; \origpage now
      336–338, not Opera 608–612) and folded in every divergence: corrected "per curvaturas"→"per
      quadraturas", restored dropped "in praxi" and "quoque" ("ita quoque praeter"), word order
      ("solet esse", "forte nullus"), "sunt" (not sint), "ceu" (not seu), "foret" (not fieret, 2nd),
      "construi" (not confici), the numeral "Curva 4 dimensionum", the plate ref "Fig. 3. Tab. VI",
      and the third differential formula $aa\,dz : \sqrt{zz-aa}$ (the Opera's $\sqrt{aa+zz}$ was an
      Opera reading). Removed the Opera's closing "Caeterum quantitas …" paragraph (absent from the
      Acta). Applied identically to original.tex and en.tex.

transcription:
  status: ai-draft
  model: claude-opus-4-8
  effort: high
  prompt_version: transcribe-v1
  submitted_via: skill
  produced: "2026-07-30"
  verification:
    flagged_pages: [337, 338]
    date: "2026-07-31"
  note: >-
    Full Latin text of the "Constructio Curvae Accessus & Recessus aequabilis …", transcribed from
    the ORIGINAL 1694 Acta Eruditorum (Leipzig, September 1694, pp. 336–338; Internet Archive
    s1id13206610, leaves 0436–0438). In the Acta it is introduced by the running heading "Jac. B.
    Constructio Curvae Accessus & Recessus aequabilis, ope rectificationis Curvae cujusdam
    Algebraicae, addenda nuperae solutioni Mensis Junii"; the "No. LX" number and pages 608–612
    belonged to the 1744 collected Opera, from which this work was first drafted before being
    re-collated against the Acta. Every displayed and inline formula was checked against the scan (the
    AI's own verification pass, not a full human review). Author notation is kept faithfully
    (HOUSESTYLE R3): doubled letters for squares, the ":" ratio/division sign, "&c." and the "&"
    ampersand; typography is normalized; round parentheses are used for the author's asides. Point
    labels remain plain math letters (R1); the inline integrals carry \displaystyle (R2/R16).
    Items flagged for the reviewer:
    (a) p. 337: this paper first NAMES the lemniscate ("seu complicatae in nodum fasciae, sive
    lemnisci, d'un nœud de ruban Gallis"). The printed mark after "jacentis notae octonarii" is a
    reclining figure-eight (the lemniscate's own shape), set as $\infty$ (closest glyph) — the numeral
    8 lying down, not the modern "infinity" concept. The Acta writes "Curva 4 dimensionum" (numeral)
    here but "quatuor" on p. 338; both kept as printed.
    (b) p. 338: the third of the four circle/hyperbola differential formulas is set
    $aa\,dz : \sqrt{zz-aa}$ (the earlier Opera-based reading had $\sqrt{aa+zz}$) — please confirm.
    (c) The lettered footnotes (a)–(f) of the 1744 Opera (Cramer's apparatus, e.g. a note citing
    "Act. Erud. 1724") and the Opera's closing "Caeterum quantitas …" paragraph are absent from the
    Acta and not present here.
    (d) Fig. 3 is on the September Acta's plate "Tab. VI"; figures/fig-3.png is the crop reused from
    No. LIX (same geometry), which was itself taken from the Opera plate Tab. XXIV — a figure-image
    source note, not a text difference.

translations:
  en:
    status: ai-draft            # machine output; a human has not yet checked it
    model: claude-opus-4-8
    effort: high
    prompt_version: translate-v1
    submitted_via: skill
    source: transcription       # translated from our own original.tex (PLAN §2.2), not any published translation
    produced: "2026-07-30"
    note: >-
      English translation of the "Constructio Curvae Accessus & Recessus aequabilis …" (Acta
      September 1694, pp. 336–338), made from original.tex and conformed to the Acta original with it.
      Every math expression, \origpage marker (336–338) and the \rmfigure image path match
      original.tex (checked by pipeline/texcompare.py); only prose is translated. Reviewer notes:
      (1) This is the paper that first names the lemniscate; the author's own embedded French phrase
      "d'un nœud de ruban" is kept untranslated (his own gloss), with "Gallis" rendered "as the French
      call it". (2) The reclining figure-eight glyph is $\infty$ (closest available mark), copied
      verbatim from original.tex. (3) The 1744 Opera's footnotes (a)–(f) and its closing "Caeterum
      quantitas …" paragraph are absent from the Acta and not present here. (4) The author's own
      asides use round parentheses and translator interpolations use square brackets (R9); "&c." is
      given as "etc." and the Latin "&" (et) as "and".
