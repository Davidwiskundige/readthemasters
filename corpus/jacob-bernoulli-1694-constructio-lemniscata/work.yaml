significance: >-
  In this September 1694 sequel to his June solution of Leibniz's paracentric isochrone,
  Jacob Bernoulli gives a second construction of the curve of uniform approach and
  recession, this time reducing it to the rectification of an algebraic curve,
  $xx + yy = a\sqrt{xx - yy}$. He describes its figure-eight shape — a reclining figure of eight,
  "a knot of a ribbon" — and names it, for the first time, the lemniscate
  ("nodum fasciae, sive lemnisci"). He shows that its arc is measured by the very same integral
  $\displaystyle\int \frac{a^{2}\,du}{\sqrt{a^{4}-u^{4}}}$ that gives the arc of the elastic curve of the June
  paper, so that either curve serves for the construction, and he classifies which differential
  formulas reduce to the quadrature of the circle or hyperbola and which to the rectification of the
  lemniscate or the ellipse. Integrals of this lemniscatic type are the ones Fagnano (1718) and then
  Euler (1751/1761) turned into the addition theorems at the origin of the theory of elliptic
  functions, and through Abel, Jacobi and Riemann into the modern theory of elliptic and Abelian
  functions.[1]

