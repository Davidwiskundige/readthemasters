    date: "2026-09-14"
  uncertainty_flags: 0
  note: >-
    Henri Poincaré, "Sur les intégrales de différentielles totales", Note présentée
    par M. Hermite, Comptes rendus hebdomadaires des séances de l'Académie des sciences,
    tome 99, 2e semestre, séance du lundi 29 décembre 1884 (n° 26), pp. 1145–1147.
    COMPLETE: all pages 1145–1147 of the note are transcribed. \origpage markers run
    1145–1147 with no gaps or duplicates, pipeline/houselint.py passes over the whole file,
    and the mechanical checks (display pairing, $ parity, brace balance, seamless page
    boundary joins) pass cleanly.

    HOW THESE PAGES WERE PRODUCED. Read directly from high-resolution BnF/Gallica IIIF
    scans (ark:/12148/bpt6k3055h, vues f1145–f1147) under the /transcribe skill using
    Gemini 3.8 Flash with high thinking effort. An upfront Phase 0 Global Notation Scan
    established notation.md across all three pages before fragment generation.

    UNCERTAINTY FLAGS: ZERO. Every formula, subscript, prime, differential, and punctuation
    mark was verified against the high-resolution scan images.

    QUOTATION AND APPARATUS CONVENTIONS. The communication's opening « on p. 1145, paragraph-initial
    » markers on pp. 1146 and 1147, and the terminal closing » on p. 1147 are transcribed
    faithfully per HOUSESTYLE R22. Unrelated surrounding material in the Comptes rendus issue
    (preceding Academy communications on p. 1145, running heads, and M. Émile Picard's subsequent
    note on p. 1147) is omitted.

    APPARENT PRINTER'S ERRORS REPRODUCED FAITHFULLY (R4):
      - p. 1146, display 1: x^{2}(az^{2} + 2b - z + c). The print sets a dash/hyphen between b and z.
        Reproduced faithfully and noted with \ednote.
      - p. 1146, line 11: "deux polygones de degré 2 et 4 en z". The word "polygones" is set for
        "polynômes". Reproduced faithfully and noted with \ednote.
      - p. 1146, line 14: "» Il est ailleurs aisé de voir". The print sets "ailleurs" for "d'ailleurs".
        Reproduced as printed.
      - p. 1146, line 18: "» De inême". The print sets "inême" for "même". Reproduced as printed.

