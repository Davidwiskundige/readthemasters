  note: Poincaré responds directly to Picard's note presented three weeks earlier
    (1 December 1884), examining fourth-order algebraic surfaces possessing integrals
    of total differentials of the first kind and extending Abel's theorem to such
    integrals.
significance: Presented to the Académie des sciences by Hermite on 29 December 1884,
  this note marks Henri Poincaré's immediate response to Émile Picard's breakthrough
  note of 1 December 1884 on total differentials on algebraic surfaces.[1] Poincaré identifies
  fourth-order surfaces that admit integrals of the first kind (ruled surfaces and
  surfaces of revolution), observes that unicursal curves on a surface force any integral
  of the first kind to be constant along them, and states an analogue of Abel's theorem
  for integrals of total differentials on algebraic surfaces.
