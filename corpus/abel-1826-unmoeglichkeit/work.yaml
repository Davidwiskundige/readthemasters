significance: >-
  This is the paper in which Abel established what is now called the Abel–Ruffini theorem: the
  general algebraic equation of the fifth degree, and of every higher degree, cannot be solved by
  radicals.[1] Paolo Ruffini had argued the same conclusion from 1799 on, but his lengthy proofs
  went largely unaccepted; Abel — at first unaware of Ruffini's work — gave the argument that
  persuaded the mathematical community.[1] Abel had first printed a terse six-page French version at
  his own expense in Christiania in 1824; this fuller German account, in the opening volume of
  Crelle's Journal, is the one that circulated, and the permutation-theoretic ideas it opened were
  carried much further by Galois.[2]

