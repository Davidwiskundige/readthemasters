significance_notes:
  - label: "The Zeuthen–Segre invariant"
    text: >-
      In modern algebraic geometry, the Zeuthen–Segre invariant $I$ is related to the topological
      Euler characteristic $e(S) = c_2(S)$ of the smooth algebraic surface $S$ by $I = e(S) - 4$.
      In terms of the arithmetic genus $p_a$ and the self-intersection of the canonical divisor
      $K^2$, Noether's formula gives $12(p_a + 1) = K^2 + e(S)$, so that $I = 12(p_a + 1) - K^2 - 4$.
