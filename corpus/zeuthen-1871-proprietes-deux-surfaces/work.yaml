significance: >-
  Twenty-nine pages in the fourth volume of the Mathematische Annalen (1871) in which Hieronymus
  Georg Zeuthen lays the geometric foundations of the birational theory of algebraic surfaces.
  Where Clebsch[1] had defined the genus through an unproved count of coefficients in adjoint
  surfaces and Noether[2] had established it through integrals of algebraic differential forms,
  Zeuthen attacks birational equivalence from a purely synthetic and projective direction.
  Taking two surfaces $[F_1]$ and $[F_2]$ whose points correspond one-to-one, he studies the curves
  $(S_1)$ on $[F_1]$ that correspond to the plane sections of $[F_2]$, tracing the exceptional
  fundamental points where the correspondence ceases to be single-valued. To compare the two surfaces
  without embedding the transformation into a Cremona transformation of ambient space, Zeuthen invents
  auxiliary surfaces $[F_3]$ and $[F_4]$ generated by bundles of rays and pencils of planes. By
  computing the Plücker characteristics of cones circumscribed about these auxiliary surfaces in two
  different ways—once from the geometry of $[F_1]$ and once from $[F_2]$—and equating the results,
  Zeuthen extracts fundamental invariant relations between the order, class, and singularities of
  the two surfaces. In his Equation (III), he discovers a numerical combination of characters that is
  preserved under any one-to-one correspondence, minus the contribution of the fundamental points.
  This is the birth of what Corrado Segre in 1896 named the Zeuthen invariant[3] (today the
  Zeuthen–Segre invariant $I$).[note 1] Zeuthen demonstrates that subtracting 24 from this invariant
  yields 24 times Cayley's deficiency (the arithmetic genus)[4], providing the first geometric proof
  of Clebsch's theorem that birationally equivalent surfaces have the same genus. In a closing
  section, Zeuthen extends his methods to branched multiple planes, introducing the branch curve
  (courbe de liaison) and proving the formula connecting its order to the genus of the covering,
  the direct precursor to the Zeuthen–Hurwitz formula.

