relations:
  - to: clebsch-1868-surfaces-algebriques
    kind: builds-on
    recommended: primary
    note: >-
      Chapter I is headed "Genre d'une courbe et d'une surface d'après Clebsch et M. Nöther", and
      the memoir cites Clebsch's note by date at the foot of p. 248 ("Comptes Rendus de l'Acad. d.
      Sc., Déc. 1868") at exactly the point where it defines the genus of a surface as the number
      of arbitrary coefficients left in an adjoint surface of order $n-4$. That is Clebsch's 1868
      count, and this memoir is where it stops being a single unproved claim and becomes the first
      of a family of birational invariants.

significance: >-
  Seventy-six pages, dated Florence, February 1896, in which the Italian school's theory of
  algebraic surfaces is set out whole for the first time. Castelnuovo and Enriques open by naming
  the two directions the subject had taken since Nöther's fundamental memoir — the transcendental
  one pursued in France, above all by Picard, and their own geometric one — and then build the
  second from the ground up: linear series on a curve, linear systems of curves on a surface,
  adjoint curves and adjoint systems, and from these a sequence of numbers unchanged by birational
  transformation. Clebsch's geometric genus $p_g$[1] is joined by Nöther's numerical genus $p_n$, by
  the plurigenera $P_2$, $p^{(1)}$ and $p^{(2)}$, and by the characteristic series of a linear
  system, whose defect turns out to measure exactly the difference $p_g - p_n$ — the quantity later
  called the irregularity. Surfaces with $p_g = p_n$ they call regular. Chapter VI carries the
  Riemann-Roch theorem across from curves to surfaces, and Chapter VII turns the machinery on the
  rational surfaces and the double planes, deducing rationality from the numerical invariants
  alone. The authors are candid that this is a theory still forming: they give the statements
  and suppress the proofs, because "on ne réussit pas, pour le moment, à exposer ces démonstrations
  de manière à éviter toute difficulté" — for the moment these proofs cannot be set out in a way
  that avoids every difficulty. They close on a climb. What matters now, they write, is to get past
  the obstacles on the path and reach the summit shining ahead of them; anyone unwilling to take so
  disagreeable a route should wait, and read instead the description of the landscape as it looks
  from the point they have so far reached, which is what this memoir is. For those who do want to
  make the climb, the pages that follow hold everything needed to do it.

