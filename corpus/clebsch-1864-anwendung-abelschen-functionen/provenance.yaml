changelog:
  - date: "2026-09-03"
    summary: >-
      Translation (en) added (AI draft); glossary.yaml added; the eight misprints that mislead a
      reader of the mathematics marked with an \ednote popover in the transcription and the
      translation alike (R4 + R10); significance note and Clebsch portrait added.
  - date: "2026-09-01"
    summary: Transcription completed to pp. 223–243; earlier pages conformed to notation.md.
  - date: "2026-08-31"
