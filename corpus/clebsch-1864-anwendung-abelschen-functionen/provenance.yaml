transcription:
  status: ai-draft
  model: claude-opus-5
  effort: high
  prompt_version: transcribe-v1
  submitted_via: skill
  produced: "2026-09-01"
  verification:
    flagged_pages: [207, 214, 216, 219, 223, 225, 227, 228, 229, 233, 234, 236, 239]
    date: "2026-09-01"
  uncertainty_flags: 5
  note: >-
    Clebsch's "Ueber die Anwendung der Abelschen Functionen in der Geometrie", Crelle's Journal
    Band 63, 3. Heft (1864). The paper runs pp. 189–243 and this file is now COMPLETE: \origpage
    markers run 189–243 with no gaps or duplicates, pipeline/houselint.py passes over the whole
    file, and all 1383 math spans render through the site's own KaTeX 0.16.47 build.

    HOW THESE PAGES WERE PRODUCED — three stretches, made differently, and a reviewer should know
    which is which.

    Pages 189–206 were transcribed on 2026-08-29 in a single long chat session, with every page
    image accumulating in one context (measured: 4.2M tokens per page).

    Pages 207–222 were transcribed on 2026-08-31 by two ISOLATED batch subagents — pp. 207–210 and
    pp. 211–222 — each given only prompts/transcribe-chat.md, corpus/HOUSESTYLE.md and its own page
    crops, with no access to this repository. That was a controlled measurement, not a production
    run; the pages are kept because they are real transcription.

    Pages 223–243 were transcribed on 2026-09-01 by five batch subagents (223–226, 227–230,
    231–234, 235–238, 239–243) under the rewritten /transcribe skill: one image per page cropped to
    the text block at 1568px, each subagent reading only its own batch's images plus this work's
    notation.md, writing one fragment per page, and returning a short report. The orchestrating
    session read NO scan image at any point (measured: 0 image tokens). Pages 223–243 were then
    re-read against the scans by two separate verification subagents covering pp. 223-232 and
    233-243, which corrected ten things the transcription had wrong: six continuation-dot rows with
    the wrong dot count or the wrong distribution across cells, three inline fractions still written
    \frac, and the p. 239 mark discussed below.

    ONE EDITORIAL JUDGMENT, recorded because it goes against the usual presumption. On p. 239 the
    second display carries a mark between u'''_k and the equivalence sign. It is NOT transcribed.
    In this work's notation a literal "." is the multiplication sign, so reproducing it would assert
    a product between a variable and a relation sign - not mathematics Clebsch could have written.
    Measured, the mark is 3x4px, area 8, sitting below the formula baseline, against the 5x5px
    area-20 dots this print sets in display math; that points to a speck rather than type, though it
    is within the size range of a text period elsewhere on the same page. R4 protects the author's
    misprints, not the scan's dirt, and the reading it would produce is impossible - so it is
    dropped rather than reproduced. A reviewer with the original in hand should confirm.

    WHAT CHANGED IN THE EARLIER PAGES ON 2026-09-01. Re-transcribing a sample of pp. 189–196 under
    the new loop and diffing against the committed text (openspec/changes/transcribe-per-batch-
    subagents, task group 5) surfaced defects in the 2026-08-29 stretch that no linter catches:
      - TWO WORDS LEFT SPLIT ACROSS A PAGE BREAK with the print's hyphen retained — p. 195 ended
        "An-" with p. 196 opening "zahl", and p. 198 ended "aus-" with p. 199 opening "reichend".
        Both rendered a stray hyphen and space inside a running word. Repaired.
      - FOOTNOTE MARKUP not following HOUSESTYLE R15: four in-text markers were "~*)" and five notes
        opened with a bare "*)". Conformed to the R15 form (${}^{*)}$ in text, \textbf{*)} at the
        note), which pp. 207–222 already used.
      - ABBREVIATION SPACING mixed "~" and "\ " (8 against 13) where R17 wants the control space;
        pp. 207–222 used it exclusively (40). Normalized.
      - SUBSCRIPTS were braced in pp. 189–206 (218) and bare in pp. 207–222 (166) — the same file
        disagreeing with itself. Normalized to braced throughout; both forms render identically, so
        this is consistency, not correction.
    None of these changes any word or formula Clebsch wrote.

    ONE PLACE THE NEW LOOP WAS WORSE, AND HOW IT WAS CAUGHT. Both A/B batches wrote \frac where the
    print sets a nested fraction at full size, flattening about 28 compound fractions. Measured
    against the scan on pp. 193 and 195, the glyphs at both nesting levels agree within ±1px, where
    a script-size shrink would be ~30% smaller. The rule is now recorded in notation.md, and the
    batch transcribing pp. 231–234 under the corrected glossary got the analogous case right.

    FIVE UNCERTAIN PASSAGES, all marked \uncertain in the text — pp. 216 (3), 219 (1), 234 (1):
    (a) p. 216 — three words inside the italic Steiner theorems where the scan has ink loss or an
    overprinted blot.
    (b) p. 219 — "u''=0", where the equals sign carries a stray diagonal mark making it look like ≠;
    the parallel clause reads v''=0 and the sense requires equality.
    (c) p. 234 — the variable in "wenn r = 2, k = m+n-4", where the sort is broken; context
    ("r-punktig", and "zweipunktig" in the next Satz) forces r.

    A CAVEAT ON THE FLAG COUNT. The pp. 211–222 batch could not magnify a damaged spot — the
    isolation rule forbade it writing crop files — so its flag rate reflects the tooling it was
    given as much as the legibility of the scan. Pages 189–210 and 223–243 were made with
    magnification available, and pp. 223–243 used it heavily (36 magnified regions across 21 pages),
    which is why 21 pages carry only one flag: doubtful readings were settled rather than flagged.
    A reviewer should not read "few flags" as "few doubts".

    APPARENT PRINTER'S ERRORS reproduced faithfully, not corrected (R4). pp. 211–222: "gleich der
    der 63 Systeme" (article doubled across a line break, p. 211); "als dass Product" for "das
    Product" (p. 219); a missing comma in "So giebt es unzählige Oberflächenpaare deren
    Durchschnitt" (p. 219). pp. 223–243: p. 223 sets "Σ± a_i b_i x_i dx_i" with four identical
    indices where the same result on p. 222 reads a_1 b_2 x_3 dx_4; p. 225 sets a roman d in
    "∂u^(s)/dx_2" where every neighbouring denominator has ∂; p. 227's last display sets the
    coefficient y_2 in rows 2 and 3 where the mathematics wants y_1 (confirmed twice, by the
    transcribing batch and by the verification pass); p. 228 has "Auschluss" for Ausschluss,
    "Hülfsatz" for Hülfssatz, eq. (23.) row 2 ending in a period where its neighbours take commas,
    and — confirmed against the scan — "die Fläche n^{ter} Ordnung als System von k Ebenen", where
    the mathematics wants k^{ter}; p. 232's Satz shifts from plural to singular ("berühren, und
    ausserdem durch … gegebene Punkte geht"); p. 233 sets n^{2p} and (n/2)^{2p} where the author's
    own preceding theorem requires (mn)^{2p} and (mn/2)^{2p}; p. 234 leaves "die zur Bestimmung …
    gleich" without the noun it governs; p. 236 sets "Schwingungsebene" once for "Schmiegungsebene"
    and sets a two-bar = in eq. (28.) where (26.) and (27.) take the three-bar ≡; p. 239's second
    display carries a mark before the ≡, which is NOT reproduced — see the editorial judgment above.
    Running heads are not transcribed, so p. 222's
    misprinted "Anwendnng" does not appear.

    TWO PASSAGES FOR A REVIEWER WITH THE MATHEMATICS. On p. 214 the fourth row of the printed
    determinant reads u_23 v_23 w_23 0 p_3 p_2, breaking the symmetry of the rows around it; it is
    legible and reproduced exactly, but deserves checking against Clebsch's derivation. On p. 229 the
    second row of the first display reads du_2^{(mnk)}; the glyph after the d is degraded in this
    scan and the verification pass could not distinguish a broken u from a printed v. The
    mathematics wants u, and it is left as u rather than changed on weak evidence.

    NOTATION is recorded in full in notation.md alongside this file, which now covers the whole
    paper: the Sigma letter rather than \sum; Clebsch's multiplication dot as a tight literal ".";
    ≡ against = followed per occurrence; nested fractions and full-size inline fractions as \dfrac;
    braced subscripts; ordinals ^{\text{ter}}/{ten}/{te}/{tes}; the upright \mathrm{w} for rank;
    both double-barred inequality sorts as \geqq; ellipsis height per context (\cdots against
    \ldots); continuation-dot rows counted off the print rather than assumed; and the fact that
    equation numbering RESTARTS at (1.) in §. 19 rather than running continuously. The print is
    Antiqua with round s only — no long-ſ, no eszett — so R19 has nothing to convert and the file
    contains no ß.

    A WHOLE-WORK PROOFREAD OF THE TEXT ALONE was then run over pp. 189-243 — no scans, one context,
    reading for the things a page-by-page check against the scan structurally cannot see. It
    confirmed the skeleton is sound (55 contiguous page markers, equation numbering, environment and
    brace balance, math delimiters, and 53 of 54 page joins carrying their sentences across intact)
    and found defects concentrated almost entirely in the pp. 207-222 stretch, which was a
    measurement run and had never had a verification pass. Repaired:
      - A THIRD word left split across a page break: p. 197 ended "In-" with p. 198 opening
        "tegrale". It had survived the earlier sweep because the hyphen sits behind a closing brace
        rather than at end of line.
      - SIX pages opening mid-sentence carried a blank line after their \origpage (208, 209, 213,
        214, 216, 221), inserting a paragraph break inside a sentence.
      - TWENTY multiplication dots set thin-spaced or spaced (pp. 207-209, 221-222) where this work
        sets them tight; nine relation signs padded \;\equiv\; where the other 83 are plain; six
        primes written after the subscript instead of before; two German closing quotes as ASCII
        rather than Unicode; one footnote mark set as baseline text inside a display instead of the
        R15 superscript; and two inline fractions written \frac where the identical formula is
        \dfrac elsewhere in the work.
    None of these changes a word or formula Clebsch wrote. All 1383 math spans still render.

    STILL OPEN, needing the print (a reviewer should start here, with the flagged pages):
      - p. 234 cites "§. 16" twice from inside §. 16, for formulas printed in §. 14 on p. 229.
        Probably a misprint or a misreading of the section number.
      - p. 223 sets "$m+n-4^{\text{ter}}$ Ordnung" without parentheses, where four neighbouring
        occurrences read "$(m+n-4)^{\text{ter}}$". As transcribed the exponent binds only to the 4.
      - p. 224's first display omits the "+" before its \cdots, where every comparable chain has one.
      - Five \tfrac spans (pp. 204, 220, 222) and a dozen inline \frac spans in pp. 207-222 that may
        or may not match the printed fraction size; the rule is to match the print, so only the scan
        settles them.
      - p. 211's "gleich der der 63 Systeme" is listed above as a doubled article, but reads as
        ordinary German with a pronominal "der", and the same construction stands uncorrected on
        p. 221. The R4 entry may be over-called.

    NOT YET HUMAN-REVIEWED. Status stays ai-draft: no person has checked these pages against the
    scan. The flagged pages above are where a reviewer should start.

translations:
  en:
    status: ai-draft            # machine output; a human has not yet checked it
    model: claude-opus-5
    effort: high
    prompt_version: translate-v1
    submitted_via: skill
    source: transcription       # from our own original.tex (PLAN §2.2)
    produced: "2026-09-02"
    note: >-
      Full English translation of all 55 pages (189–243), made only from our own original.tex and
      never from an existing published translation. pipeline/texcompare.py reports math, \origpage
      markers and refs preserved, and pipeline/houselint.py is clean over both files. The
      translated body is line-for-line identical in structure to original.tex — 1476 lines against
      1476, every \origpage, display, \tag, \emph run, footnote and blank line on the same line
      number — so the two files can be diffed side by side and every difference is prose.

      Prose set INSIDE math via a text insert is translated (HOUSESTYLE R21). This work has 168 of
      them and they are almost all one construction: 162 ordinal suffixes (128 "ter", 24 "ten",
      7 "te", 3 "tes"), which become "th" because English marks the ordinal on the numeral rather
      than on the adjective — "Curve $n^{\text{ter}}$ Ordnung" reads "curve of the $n^{\text{th}}$
      order". Two of the 162 have a numeral stem and take the form that numeral demands, so p. 239
      reads "$2^{\text{nd}}$", "$3^{\text{rd}}$". The remaining six inserts are the abbreviation
      "mod.", identical in both languages, and stand unchanged. texcompare ignores the content of
      an insert while still checking that each is present and unmoved, so these changes are
      invisible to it and were verified by hand against a listing of every insert in both files.

      TERMINOLOGY is recorded in glossary.yaml, added with this translation, and the reasoning is
      summarized in the file header of en.tex. The two decisions worth a reviewer's attention:
      period English over the modern word wherever Clebsch's own English contemporary Salmon — whom
      he cites twice by name — has one (Doppeltangente = "double tangent", not "bitangent";
      Rückkehrpunkt = "cusp"; ganze Function = "integral function"; Functionaldeterminante =
      "functional determinant", not "Jacobian"); and keeping Büschel = "pencil" apart from Schaar =
      "family", which modern usage would merge, because Clebsch uses them for different things.

      "$r$-punktig berühren", the paper's central phrase, is "touch with $r$-point contact", so
      that "in $p$ Punkten $r$-punktig berühren" reads "touch at $p$ points with $r$-point
      contact" and the two counts stay separate.

      NAMES. The print italicizes the stem inside a derived adjective and the transcription wraps
      the stem only; English suffixes attach to the same stems, giving \emph{Abel}ian and
      \emph{Jacobi}an as in the Riemann and Roch translations. "Hessian" and "Cayleyan" (p. 217)
      alter the stem, so those two are emphasized whole. Cited titles are left in their original
      language, inside the print's own German quotation marks where it sets them.

      GERMAN COMPOSITOR'S SLIPS ARE NOT CARRIED ACROSS — they have nothing to be faithful to in
      English and are rendered by the correct word, remaining recorded in the transcription and in
      the transcription note above: p. 190 "Dnrchgangspunkt" and "ihr Geltung", p. 219 "als dass
      Product", p. 228 "Auschluss" and "Hülfsatz", p. 232's shift from plural to singular inside
      one Satz, and the sentence on p. 195 that ends without its full stop.

      EIGHT MISPRINTS NOW CARRY AN IN-TEXT \ednote POPOVER, in original.tex and in en.tex alike, at
      the same line number in both. The criterion is the one the Riemann memoir set: an apparent
      misprint is reproduced faithfully (R4) and recorded here, and is marked in-text (R10) only
      when it would mislead a reader of the MATHEMATICS. Each note names what the print sets and
      what the surrounding argument requires, and ends "Kept as printed":
      (a) p. 223 — the displayed integral in the first theorem is printed with one index throughout,
      Σ± a_i b_i x_i dx_i, where the same alternating sum is set with four distinct indices on
      pp. 221 and 222 and in the very next theorem.
      (b) p. 225 — the second row of the differentiated system has a roman d in its last denominator
      where every other denominator in the same system has ∂.
      (c) p. 226 — Clebsch writes that the bracketed expression is "0 oder gleich dem entsprechenden
      Werth von 1/R, jenachdem die $x'$ ein zusammengehöriges System bilden oder nicht", but by his
      own equation (21.) and the argument just above it the expression is 1/R when the $x'$ DO
      belong together and 0 when they do not — the two alternatives are paired the wrong way round.
      His order is KEPT: that is a statement about the mathematics, not a slip in the German, so it
      is translated exactly as it stands rather than quietly reordered. The note matters most here,
      and for a reason specific to translation — the sentence says which of two alternatives holds
      and gives a reader nothing to check it against, so an unmarked "or not" in the English would
      read as the TRANSLATOR's error rather than the author's.
      (d) p. 227 — rows 2 and 3 of the homogeneity relations carry the coefficient y_2 where Euler's
      relation, of which row 1 is the pattern, pairs y_1 with ∂v/∂y_1.
      (e) p. 228 — "die Fläche n^{ter} Ordnung als System von k Ebenen": it is the cutting surface
      w=0, of order k, that degenerates, and the same clause counts k planes.
      (f) p. 233 — the §. 16 theorem is printed with n^{2p} and (n/2)^{2p}, carried over from the
      corresponding plane theorem in §. 7; the curve here is of order m.n, so §. 15 gives (mn)^{2p}
      and (mn/2)^{2p}.
      (g) p. 236 — "Schwingungsebene" (plane of oscillation) where the sentences on either side and
      the mathematics all require "Schmiegungsebene" (osculating plane). A whole wrong word rather
      than a misspelling, so it is the one misprint of the eight that the TRANSLATION does not
      reproduce: en.tex reads "osculating plane" and its note says so, where the transcription's
      note ends "Kept as printed". The only one of the eight whose two notes differ in wording.
      (h) p. 236 — equation (28.) is set with a two-bar = where (25.), (26.) and (27.) all take the
      three-bar ≡; these are congruences with respect to the periods.

      Adding (a), (b), (d), (e), (f), (g) and (h) to original.tex is a transcription-side change
      made during this translation pass, on the contributor's instruction, applying the rule the
      corpus already had rather than a new one. None of them adds or alters mathematics, and
      texcompare still reports the two files identical in every math span, \origpage marker and ref.

      ONE BRACKETED SUPPLY, on p. 234. "so ist nach §. 16 die zur Bestimmung der Schnittpunkte der
      Fläche mit der Curve gleich" is missing the noun that "die" governs, so the English clause has
      no subject. The translation supplies "[number]" in square brackets, the house device for a
      translator's addition (R9); the author's own asides use parentheses and ours never do. This is
      a gap in the German rather than a misprint in the mathematics, so it takes no popover.

      STILL UNMARKED, and where a reviewer with the print should start. The remaining slips listed
      in the transcription note are orthographic or grammatical and mislead nobody about the
      mathematics: "Auschluss" and "Hülfsatz" (p. 228), "als dass Product" (p. 219), the doubled
      article on p. 211, eq. (23.)'s row ending in a period, p. 232's shift from plural to singular.
      Three readings the transcription lists as STILL OPEN are also left unmarked, because settling
      them needs the scan rather than an argument from the text: p. 234's "§. 16" citing formulas
      printed in §. 14, p. 223's "m+n-4^{ter} Ordnung" without parentheses, and p. 224's chain
      missing the "+" before its ellipsis. If those hold against the print they should get the same
      popover the eight above have.

      The five \uncertain spans of the transcription are carried across and translated in place
      (p. 216 "gezogenen" → "drawn", "Geraden" → "straight lines", and a bare "$c$"; the p. 219 and
      p. 234 spans are mathematics and stand unchanged). Four sentences could not keep both their
      word order and their page break, since German holds its verb to the end; the \origpage
      markers did not move and the English clause was rebalanced around them instead (202/203,
      207/208, 220/221, 229/230). All are listed in the file header.

      NOT YET HUMAN-REVIEWED. Status stays ai-draft: no person has checked this translation against
      the transcription.
