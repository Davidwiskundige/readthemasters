significance: The full memoir behind Noether's 1869 Göttingen note, carrying Clebsch's
  genus from curves and surfaces to algebraic varieties of arbitrary dimension. Noether
  proves the birational invariance of the dimension of the space of everywhere finite
  $r$-fold differential forms (the geometric genus $p_g$) and establishes the role
  of adjoint systems for varieties with multiple loci.
