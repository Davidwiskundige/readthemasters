  note: 'Weierstrass''s opening sentence names Riemann as the mathematician who applied
    Dirichlet''s mode of inference most widely, and Riemann''s 1851 dissertation is
    where that application is made: the existence theorems for functions on a surface
    rest there on the assumption that the Dirichlet integral attains its minimum.
    This note is the critique of that assumption, so the edge runs backward to the
    work it undermines rather than extends.'
significance: 'Weierstrass read these six pages to the Berlin Academy on 14 July 1870,
  and they ended a twenty-year habit of argument. Dirichlet had justified a main theorem
  of potential theory by observing that a certain non-negative integral must have
  a smallest value, and that the function realizing it must then satisfy Laplace''s
  equation; Riemann built the existence theorems of his function theory on the same
  step, and named it the Dirichlet principle.[1] Weierstrass grants the integral a
  greatest lower bound and denies the inference to a minimizing function: a quantity
  bounded below need not attain its bound within the class of functions considered.

  He makes the objection unanswerable with a one-dimensional counterexample rather
  than a general argument. Taking $J = \displaystyle\int_{-1}^{+1} \left(x \frac{d\varphi}{dx}\right)^{2}
  dx$ over the continuously differentiable $\varphi$ with prescribed values $a$ and
  $b$ at the two endpoints, he exhibits admissible functions making $J$ as small as
  one pleases, so the lower bound is zero; and he shows that zero is not attained,
  because reaching it would require $d\varphi/dx$ to vanish at every point of the interval,
  making $\varphi$ constant and contradicting $a \neq b$. The greatest lower bound is therefore not a minimum, and the Dirichlet
  inference, applied here, yields a false result.

  The consequences were large and slow. Riemann''s theory was left resting on an unproved
  foundation, and the repair took decades: Schwarz''s alternating method, presented
  to the same Academy that October by Weierstrass himself, and Neumann''s arithmetic
  mean, replaced the principle for the cases that mattered, and Hilbert rehabilitated
  the principle itself in 1900 by restricting the class of admissible functions.[2]
  The episode is also the clearest single specimen of what Weierstrass''s rigor cost
  and bought: the counterexample is elementary, the class of functions is the author''s
  own, and the target was the most convenient tool in analysis.'
