  rights_note: 'Transcribed from Mathematische Werke von Karl Weierstrass, Zweiter
    Band: Abhandlungen II (Berlin: Mayer & Müller, 1895), pp. 49–54 — the first printing
    of this text and the earliest edition that exists, since the 1870 reading was
    never printed. Only Weierstrass''s own text and the heading''s parenthetical reading-date
    line are transcribed; running heads, page numbers and signature marks are not.
    The volume was seen through the press by Johannes Knoblauch (1855–1915) for the
    Prussian Academy, so any editorial matter in it is itself long out of copyright
    under life+70; these six pages in any case carry no editorial footnotes, commentary,
    or critical apparatus. No modern re-typesetting is involved.'
