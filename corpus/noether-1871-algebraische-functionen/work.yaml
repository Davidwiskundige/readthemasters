significance: >-
  Noether introduces the resolution of curve singularities by successive quadratic
  transformations without Puiseux expansions. Extending the technique to surfaces,
  he calculates the genus reduction for double planes and generalises Cayley's
  discovery that negative deficiency ($p = -q$) characterizes scrolls and cones over
  curves of genus $q$.
