    note "Zur Theorie der algebraischen Functionen mehrerer complexer Variabeln".
- to: cayley-1871-deficiency-surfaces
  kind: cites
  note: Noether discusses Cayley's method of resolving higher curve singularities
    via Puiseux expansions and addresses the deficiency and representation of algebraic
    surfaces.
