    Full French text of Henri Poincaré's memoir "Sur les courbes tracées sur une surface algébrique",
    originally published in Sitzungsberichte der Berliner Mathematischen Gesellschaft, 10. Jahrgang
    (1911), pp. 28–55 (supplement to Archiv der Mathematik und Physik, 3. Reihe, Band 18, 1911),
