significance: In this 1911 memoir published in the Sitzungsberichte der Berliner Mathematischen
  Gesellschaft[1], Poincaré extends and refines his celebrated 1910 theory of curves
  traced on algebraic surfaces. Presenting his transcendental methods to the Berlin
  Mathematical Society, Poincaré synthesizes the theory of normal functions and abelian
  integrals on moving plane sections, exploring the algebraic relations between curves,
  the rank of continuous systems, and the topological invariant $\rho$ of Picard that
  would form the basis for Solomon Lefschetz's topological theory of algebraic surfaces[2].
