significance: >-
  Klein wrote this little book out of his lectures of 1880/81 to recover what he took to be
  Riemann's original train of thought, which Riemann's own papers[1] leave almost unstated. He puts
  physics first: a complex function is read as a steady flow of electricity over a surface, and
  where Riemann had relied on the Dirichlet principle, whose inference Weierstrass had shown to be
  unsound[2], Klein appeals openly to physical intuition and claims no rigorous proof. Following a
  remark of Prym's, he lets the flows run on an arbitrary closed surface in space rather than on
  sheets spread over the plane. A sphere with $p$ handles carries $2p$ independent everywhere finite
  flows, driven by electromotive forces along curves round the handles, and the familiar
  many-sheeted Riemann surface reappears only as the conformal image of such a surface under a
  single-valued function. The last section turns the theory to conformal mapping. It counts $3p - 3$
  moduli for $p > 1$ and extends the count to symmetric surfaces, to surfaces with boundary and to
  one-sided "double surfaces" such as a paper strip twisted before its ends are joined, as a gloss
  on the closing remarks of Riemann's dissertation[3]. The idea of a Riemann surface as a surface
  in its own right, prior to any function, was given a rigorous form by Hermann Weyl in Die Idee
  der Riemannschen Fläche (1913).
