# OpenSpec project configuration. `context` is injected into every OpenSpec request;
# it replaces the older openspec/project.md. See PLAN.md for the full design.
schema: spec-driven

context: |
  # ReadTheMasters — project context

  ## What this project is
  A static website + git-versioned corpus that publishes AI LaTeX transcriptions and translations
  of **public-domain** mathematics and physics texts. Goals and non-goals: PLAN.md §1.1.

  ## Stack
  - Corpus: plain-text LaTeX + YAML, one folder per work under `corpus/`.
  - Validation / pipeline: Python 3.11+ (only dependency: PyYAML). Entry point `pipeline/validate.py`.
  - Site: Astro static site, KaTeX for math, Pagefind for search, client-side facet filtering over a
    build-time `works.json` (from `pipeline/build_site_data.py`). Hosted on Cloudflare / GitHub Pages.
  - PDFs: Tectonic at deploy time. CI: GitHub Actions — the copyright gate + LaTeX compile must pass
    before anything merges.

  ## Non-negotiable rules
  1. The copyright gate is absolute. Nothing publishes unless `pipeline/validate.py` passes. It
     evaluates BOTH life+70 (author death date) AND the US 95-year rule (first-publication date),
     plus edition rights and translation provenance. Copyright-critical facts must be sourced (§2.5).
  2. Faithful content, standardized markup. Transcribe the original faithfully; never modernize
     notation. Standardize only the LaTeX markup via the shared preamble (§4.4).
  3. The project pays for no AI compute. All AI runs on contributors' own accounts (§7).
  4. Provenance is mandatory. Every artifact records model, effort, prompt version, status.

  ## Spec-driven workflow
  Each feature is a change under `openspec/changes/<name>/` with `proposal.md`, delta `specs/`, and
  `tasks.md`. When a change ships, fold its delta specs into `openspec/specs/` (the source of truth
  for what the system IS) and archive the change. Adding a new text is NOT a spec change — it is an
  ordinary pull request, gated by CI.

  Shipped capabilities (in `openspec/specs/`): corpus-format, copyright-gate, site-catalog, search,
  math-search, transcription-pipeline, translation-pipeline. Their archived changes live under
  `openspec/changes/archive/`.

  ## Conventions
  - ISO dates (`YYYY-MM-DD`) or bare years where only a year is known.
  - Canonical work IDs: Wikidata QID → DOI → deterministic slug (§3.2).
  - Controlled vocabulary in `corpus/vocab.yaml`; CI rejects values outside it.
  - Commits/PRs carry a DCO `Signed-off-by` line (§11.1).
